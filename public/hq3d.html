<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D 楼层分布图</title>
<style>
  :root{
    --ink:#16263a; --ink2:#5a6c83; --ink3:#8798ac;
    --line:rgba(146,168,198,.3);
    --panel:rgba(255,255,255,.88);
    --accent:#3a6fd8;
    --shadow:0 18px 52px rgba(33,60,102,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 100% at 50% -8%, #f6faff 0%, #dfeaf8 42%, #c3d4e8 100%);
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0}

  /* 建筑外观模式：按照片实测的天空 —— 左 #96C6EA 雾感浅蓝 → 右 #2A60BA 深蓝 */
  body.sky-real{
    background:
      linear-gradient(100deg, #96C6EA 0%, #7CB5E2 22%, #5FA0D8 45%, #397BD1 72%, #2A60BA 100%),
      linear-gradient(to bottom, #2A60BA 0%, #4B8FD6 55%, #ABCAE6 100%);
    background-blend-mode: normal;
  }
  body.sky-real #vignette{
    background:
      radial-gradient(120% 100% at 50% 8%, rgba(255,255,255,0) 42%, rgba(12,26,54,.26) 100%),
      linear-gradient(to bottom, rgba(255,255,255,.06), rgba(10,22,48,.16));
  }

  #side{
    /* 宽度由 --side-w 驱动：可拖拽调整（300~560），默认 358 比原 302 宽出一截，
       房间名、使用人、面积才不至于被挤成一串省略号 */
    position:fixed;left:18px;top:18px;bottom:18px;width:var(--side-w,358px);min-width:264px;
    display:flex;flex-direction:column;gap:10px;padding:17px 15px;
    background:var(--panel);
    backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;z-index:20;
  }
  /* 右缘拖拽手柄：贴在面板内侧，命中区 10px，视觉上只是一条细线 */
  .side-grip{
    position:absolute;top:56px;bottom:56px;right:0;width:10px;cursor:col-resize;
    background:transparent;border-radius:3px;z-index:6;
  }
  .side-grip::after{
    content:'';position:absolute;top:0;bottom:0;right:4px;width:2px;border-radius:2px;
    background:rgba(150,175,205,.0);transition:background .18s;
  }
  .side-grip:hover::after,.side-grip.drag::after{background:var(--accent)}
  body.side-dragging{cursor:col-resize;user-select:none}
  body.side-dragging #canvas,body.side-dragging canvas{pointer-events:none}

  .brand{display:flex;gap:11px;align-items:center;flex:none}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(150deg,#4d86e8,#2c58bd);color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1.2;
    letter-spacing:.5px;box-shadow:0 6px 15px rgba(58,111,216,.34);text-align:center;
  }
  .brand h1{margin:0;font-size:14px;letter-spacing:.2px}
  .brand p{margin:3px 0 0;font-size:10.5px;color:var(--ink3);letter-spacing:.2px}

  .bldg{display:flex;gap:5px;flex:none}
  .bldg button{
    flex:1;border:1px solid rgba(176,196,222,.55);background:rgba(255,255,255,.72);
    border-radius:11px;padding:8px 4px;cursor:pointer;font-family:inherit;
    font-size:12px;color:var(--ink2);transition:.2s;line-height:1.25;
  }
  .bldg button b{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
  .bldg button span{font-size:9.5px;color:var(--ink3);letter-spacing:.3px}
  .bldg button:hover{background:#fff;border-color:rgba(58,111,216,.45)}
  .bldg button.on{
    background:linear-gradient(150deg,#eaf1fd,#f7faff);border-color:var(--accent);
    box-shadow:0 3px 12px rgba(58,111,216,.16);
  }
  .bldg button.on b{color:#2c58bd}

  .seg{display:flex;gap:4px;background:rgba(229,238,250,.9);padding:4px;border-radius:11px;flex:none}
  .seg button{
    flex:1;border:0;background:transparent;border-radius:8px;padding:7px 0;
    font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.2s;font-weight:500;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(58,111,216,.16)}

  /* 副控件：只在整栋模式出现 */
  .seg.sub{
    background:transparent;padding:0;gap:0;height:0;overflow:hidden;
    transition:height .22s, margin .22s;margin-top:-12px;flex:none;
  }
  .seg.sub.on{
    height:26px;margin-top:0;background:rgba(228,238,250,.75);
    padding:3px;border-radius:9px;
  }
  .seg.sub button{font-size:10.5px;padding:3px 0;border-radius:6px}
  .seg.sub button.on{box-shadow:0 1px 5px rgba(58,111,216,.16)}

  .search{position:relative;flex:none}
  .search input{
    width:100%;border:1px solid rgba(176,196,222,.6);background:rgba(255,255,255,.92);
    border-radius:10px;padding:8px 30px;font-size:12.5px;font-family:inherit;
    color:var(--ink);outline:none;transition:.18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,111,216,.12)}
  .search input::placeholder{color:#a6b5c8}
  .search .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:#9babc0;pointer-events:none}
  .search .clr{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    color:#a6b5c8;font-size:15px;cursor:pointer;line-height:1;padding:2px 5px;display:none;border-radius:5px;
  }
  .search .clr:hover{background:rgba(230,238,249,.9);color:var(--ink)}
  #results{
    position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40;
    background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(30,56,96,.16);
    border:1px solid rgba(206,220,238,.9);max-height:262px;overflow-y:auto;display:none;
  }
  #results.show{display:block}
  #results .r{
    padding:7px 11px;cursor:pointer;border-bottom:1px solid rgba(232,239,248,.9);
    display:flex;align-items:center;gap:6px;font-size:12px;
  }
  #results .r:last-child{border-bottom:0}
  #results .r:hover,#results .r.hl{background:rgba(232,241,252,.95)}
  #results .r b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .r i{
    font-style:normal;font-size:9.5px;color:#fff;background:#9dadc2;border-radius:4px;
    padding:1px 4px;flex:none;min-width:26px;text-align:center;
  }
  #results .r i.b2{background:#e09a4a}
  #results .r em{font-style:normal;color:var(--ink3);font-size:10.5px;margin-left:auto;flex:none;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #results .empty{padding:12px;font-size:12px;color:var(--ink3);text-align:center}

  .glabel{font-size:9.5px;font-weight:600;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase;flex:none}
  .group{display:flex;flex-direction:column;gap:6px;flex:none;min-height:0}
  .group.grow{flex:1 1 auto;min-height:96px}

  .floors{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;padding-right:3px}
  .floors::-webkit-scrollbar{width:6px}
  .floors::-webkit-scrollbar-thumb{background:rgba(148,170,200,.42);border-radius:3px}
  .fitem{
    display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;
    border-radius:9px;padding:3px 8px 3px;cursor:pointer;font-family:inherit;font-size:12px;
    color:var(--ink2);text-align:left;transition:.15s;width:100%;
  }
  .fitem:hover{background:rgba(232,240,251,.92);color:var(--ink)}
  .fitem.on{background:linear-gradient(90deg,rgba(58,111,216,.14),rgba(58,111,216,.02));border-color:rgba(58,111,216,.3);color:var(--ink)}
  .fitem .tag{
    font-size:9.5px;font-weight:700;color:#fff;background:#9dadc2;border-radius:5px;
    padding:2px 0;min-width:30px;text-align:center;flex:none;letter-spacing:.2px;
  }
  .fitem.on .tag{background:var(--accent)}
  .fitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem.on .nm{font-weight:600}
  .fitem .ct{font-size:10px;color:var(--ink3);flex:none}

  .legend{display:grid;grid-template-columns:1fr 1fr;gap:1px 5px}
  .lg{
    display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2);
    cursor:pointer;border-radius:6px;padding:2px 3px;transition:.15s;border:1px solid transparent;
  }
  .lg:hover{background:rgba(232,240,251,.9)}
  .lg.off{opacity:.3}
  .lg i{width:8px;height:8px;border-radius:2.5px;flex:none;display:block}
  .lg-note{
    grid-column:1/-1;margin-top:4px;font-size:9.5px;line-height:1.5;color:var(--ink3);
    border-top:1px dashed var(--line);padding-top:6px;
  }

  /* 图例与统计：默认收起成一行摘要。
     原来这两块常驻占 367px，而 20 层的列表只剩 139px（能看到 3 层）；
     收进托盘后列表拿到 ~520px，摘要行照样给到关键数字。 */
  .tray{flex:none;border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
  .tray-head{
    display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
    font-family:inherit;padding:1px 2px;cursor:pointer;color:var(--ink2);border-radius:7px;
  }
  .tray-head:hover{background:rgba(232,240,251,.9)}
  .tray-sum{
    margin-left:auto;font-size:10px;color:var(--ink3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
  }
  .tray .chev{flex:none;font-size:9px;color:var(--ink3);transition:transform .2s;line-height:1}
  .tray.open .chev{transform:rotate(180deg)}
  .tray-body{display:none;margin-top:9px;max-height:42vh;overflow-y:auto;padding-right:3px}
  .tray-body::-webkit-scrollbar{width:6px}
  .tray-body::-webkit-scrollbar-thumb{background:rgba(148,170,200,.42);border-radius:3px}
  .tray.open .tray-body{display:block}

  .stats{
    margin-top:12px;padding-top:10px;border-top:1px solid rgba(200,214,232,.55);
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;
  }
  .st b{display:block;font-size:13.5px;letter-spacing:.2px;font-variant-numeric:tabular-nums}
  .st span{font-size:9px;color:var(--ink3);line-height:1.35;display:block}
  .foot{font-size:9.5px;color:var(--ink3);line-height:1.55;flex:none;margin-top:9px;
    padding-top:8px;border-top:1px dashed rgba(200,214,232,.7)}

  #detail{
    position:fixed;right:18px;top:18px;width:302px;padding:19px;z-index:20;
    max-height:calc(100vh - 36px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--panel);
    backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow);
    transform:translateX(24px);opacity:0;pointer-events:none;
    transition:transform .34s cubic-bezier(.22,1,.36,1),opacity .26s;
  }
  #detail.show{transform:none;opacity:1;pointer-events:auto}
  #detail::-webkit-scrollbar{width:5px}
  #detail::-webkit-scrollbar-thumb{background:rgba(148,170,200,.42);border-radius:3px}
  #detail .x{
    position:absolute;right:11px;top:9px;border:0;background:transparent;font-size:19px;
    line-height:1;color:var(--ink3);cursor:pointer;padding:4px;font-family:inherit;border-radius:6px;
  }
  #detail .x:hover{background:rgba(230,238,249,.9);color:var(--ink)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:rgba(58,111,216,.1);color:#2f5ec4}
  .chip i{width:7px;height:7px;border-radius:50%;display:block}
  #dNo{font-size:10.5px;color:var(--ink3);margin:9px 0 0;letter-spacing:.6px;font-weight:600}
  #dName{margin:3px 0 4px;font-size:19px;letter-spacing:.2px;line-height:1.3}
  #dSub{font-size:11.5px;color:var(--ink3);margin-bottom:13px;line-height:1.5}
  dl{margin:0;display:flex;flex-direction:column;gap:1px;background:rgba(226,235,247,.55);border-radius:12px;overflow:hidden}
  dl>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;background:rgba(255,255,255,.74)}
  dt{font-size:11.5px;color:var(--ink3);margin:0;flex:none}
  dd{margin:0;font-size:12.5px;font-weight:600;text-align:right;line-height:1.45}
  .bar{margin-top:11px}
  .bar .t{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-bottom:4px}
  .bar .tr{height:5px;border-radius:3px;background:rgba(214,226,241,.9);overflow:hidden}
  .bar .fi{height:100%;border-radius:3px;background:linear-gradient(90deg,#5b91e8,#3a6fd8);transition:width .3s}
  .raw{margin-top:11px;font-size:10.5px;color:var(--ink3);line-height:1.6;border-top:1px dashed rgba(180,198,220,.7);padding-top:8px}

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:9;
    background:
      radial-gradient(115% 92% at 52% 42%, rgba(255,255,255,0) 38%, rgba(58,92,138,.10) 100%),
      linear-gradient(to bottom, rgba(255,255,255,.05), rgba(60,95,140,.05));
  }
  #labels{position:fixed;inset:0;pointer-events:none;z-index:10}
  .lbl{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    font-size:10px;padding:2px 6px;border-radius:6px;
    background:rgba(255,255,255,.93);border:1px solid rgba(158,180,212,.55);
    color:#21354d;white-space:nowrap;box-shadow:0 2px 6px rgba(38,66,110,.09);
    transition:opacity .18s;
  }
  .lbl.sm{font-size:9px;padding:1px 4px}

  #tip{
    position:fixed;z-index:30;pointer-events:none;padding:5px 9px;border-radius:8px;
    background:rgba(26,42,66,.92);color:#fff;font-size:11.5px;letter-spacing:.2px;
    opacity:0;transform:translate(-50%,-140%);transition:opacity .15s;white-space:nowrap;
  }
  #tip.show{opacity:1}

  #hint{
    position:fixed;left:50%;bottom:15px;transform:translateX(-50%);
    font-size:11px;color:#7a8ca2;letter-spacing:.3px;z-index:15;
    background:rgba(255,255,255,.74);padding:6px 13px;border-radius:20px;
    border:1px solid rgba(255,255,255,.92);backdrop-filter:blur(10px);white-space:nowrap;
  }
  /* 整栋模式的楼层刻度导航 */
  #floorTicks{
    position:fixed;right:20px;top:0;bottom:0;width:46px;
    z-index:16;display:none;pointer-events:none;
  }
  #floorTicks.on{display:block}
  #floorTicks button{
    position:absolute;right:0;
    display:flex;align-items:center;justify-content:flex-end;gap:5px;
    border:0;background:transparent;
    font-family:inherit;font-size:9.5px;color:#93a4b8;cursor:pointer;
    padding:0;line-height:1;height:13px;transition:color .14s,transform .14s;
    letter-spacing:.2px;pointer-events:auto;
  }
  #floorTicks button:hover{transform:translateX(-2px)}
  #floorTicks button:hover{color:var(--accent)}
  #floorTicks button i{
    display:block;width:11px;height:1.5px;background:currentColor;border-radius:1px;
    transition:.16s;
  }
  #floorTicks button.on{color:var(--accent);font-weight:700}
  #floorTicks button.on i{width:22px;height:2.5px}
  #floorTicks button.vacant-dot::after{
    content:'';width:4px;height:4px;border-radius:50%;background:#2f9e6b;margin-left:-1px;
  }

  #compass{
    position:fixed;right:26px;bottom:20px;z-index:15;width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);
    box-shadow:0 6px 16px rgba(33,60,102,.12);backdrop-filter:blur(10px);
    display:grid;place-items:center;
  }
  #compass .needle{
    width:2px;height:22px;border-radius:2px;position:relative;
    background:linear-gradient(to bottom,#3a6fd8 0%,#3a6fd8 48%,#cfd9e6 48%,#cfd9e6 100%);
  }
  #compass .needle::before{
    content:'';position:absolute;top:-4px;left:-3px;
    border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid #3a6fd8;
  }
  #compass b{position:absolute;top:-14px;font-size:8.5px;font-weight:700;color:#6b7d93;letter-spacing:.5px}
  #bldgTag{position:fixed;right:26px;top:22px;z-index:15;text-align:right}
  #bldgTag b{display:block;font-size:12px;color:#41556e;letter-spacing:.4px}
  #bldgTag span{font-size:10px;color:#8d9db1}

  /* 本层面积合计设置条 */
  .areabar{
    display:flex;align-items:center;gap:5px;flex:none;
    padding:5px 7px;margin-bottom:4px;border-radius:8px;
    background:rgba(240,246,253,.92);border:1px solid rgba(206,220,238,.8);
    font-size:10px;color:var(--ink3);line-height:1.4;
  }
  .areabar input{
    width:56px;font-family:inherit;font-size:11px;color:var(--ink);
    border:1px solid rgba(176,196,222,.8);background:#fff;border-radius:5px;
    padding:2px 5px;outline:none;text-align:right;font-variant-numeric:tabular-nums;
  }
  .areabar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,111,216,.12)}
  .areabar .cov{margin-left:auto;flex:none;font-size:9.5px;color:#7c8da1}
  .areabar .cov b{color:#2f9e6b;font-weight:700}

  .rm .ar{
    font-size:10px;color:var(--ink2);flex:none;width:52px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .rm .ar.est{color:#9aabbd}
  .rm .ar.none{color:#c3ccd8}

  /* 房间资料编辑 */
  .editbtn{
    position:absolute;right:44px;top:9px;border:1px solid rgba(176,196,222,.75);
    background:rgba(255,255,255,.9);color:var(--ink2);font-family:inherit;font-size:10.5px;
    border-radius:7px;padding:3px 8px;cursor:pointer;transition:.15s;
  }
  .editbtn:hover{border-color:var(--accent);color:var(--accent);background:#fff}
  .edited{
    font-size:9px;font-weight:700;color:#8a6d1f;background:rgba(217,155,58,.16);
    border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:2px;
  }
  .editform{display:none;flex-direction:column;gap:7px;margin:10px 0 4px;
            background:rgba(240,246,253,.97);border:1px solid rgba(190,212,238,.95);
            border-radius:12px;padding:11px}
  .editform.on{display:flex}
  .editform .fl{font-size:9.5px;font-weight:600;color:var(--ink3);letter-spacing:.6px;
                text-transform:uppercase;margin-bottom:-3px}
  .editform input,.editform select,.editform textarea{
    font-family:inherit;font-size:12px;color:var(--ink);
    border:1px solid rgba(176,196,222,.8);background:#fff;border-radius:7px;
    padding:6px 8px;outline:none;width:100%;transition:.15s;
  }
  .editform input:focus,.editform select:focus,.editform textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,111,216,.12)}
  .editform textarea{resize:vertical;min-height:40px;line-height:1.5}
  .editform .hintline{font-size:9.5px;color:var(--ink3);line-height:1.5}
  .editform .acts{display:flex;gap:6px;margin-top:2px}
  .editform .acts button{
    flex:1;border:0;border-radius:7px;padding:7px 0;font-family:inherit;
    font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .editform .acts .ok{background:linear-gradient(150deg,#4d86e8,#2f5ec4);color:#fff;
                      box-shadow:0 3px 10px rgba(58,111,216,.28)}
  .editform .acts .ok:hover{filter:brightness(1.06)}
  .editform .acts .no{background:rgba(226,235,247,.95);color:var(--ink2);flex:0 0 64px}
  .editform .acts .rst{background:rgba(255,246,235,.95);color:#a06c17;flex:0 0 74px}

  .histbox{margin-top:9px;border-top:1px dashed rgba(180,198,220,.7);padding-top:8px}
  .histbox .h{font-size:9.5px;letter-spacing:.8px;color:var(--ink3);font-weight:600;
              text-transform:uppercase;margin-bottom:5px}
  .histrow{display:flex;gap:6px;font-size:10px;color:var(--ink2);line-height:1.6;

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   数据
   ========================================================= */
/* =========================================================
   数据来源：smart-office 的 MySQL
   —— 布局基线（楼栋/楼层/房间）与业务覆盖（房间资料、维护记录、
      楼层面积）都由 /api/hq3d/snapshot 一次取回，页面不再自带数据。
   —— 取不到就停在错误页，绝不用内嵌的旧数据假装"正常"：
      那样两边的房间号一旦不一致，改的东西会写到一个不存在的房间上。
   ========================================================= */
const FALLBACK_KEY = 'hq3d.snapshot.cache.v1';

function degradedNotice(text){
  let el = document.getElementById('bootError');
  if (!el){
    el = document.createElement('div');
    el.id = 'bootError';
    el.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;' +
      'background:linear-gradient(160deg,#eef4fc,#d9e6f6);font:14px/1.7 -apple-system,"PingFang SC",sans-serif;color:#22364f;padding:32px;text-align:center';
    document.body.appendChild(el);
  }
  el.innerHTML = '<div style="max-width:520px">' +
    '<div style="font-size:17px;font-weight:700;margin-bottom:10px">楼层数据暂时取不到</div>' +
    '<div style="color:#4e6178;margin-bottom:14px">' + text + '</div>' +
    '<div style="font-size:12.5px;color:#7b8da3">请确认已登录智慧办公系统、服务端可访问，然后刷新页面。</div>' +
    '</div>';
}

async function loadSnapshot(){
  const res = await fetch('/api/hq3d/snapshot', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (res.status === 401) throw new Error('未登录或登录已过期');
  if (!res.ok) throw new Error(`接口返回 ${res.status}`);
  const data = await res.json();
  if (!data || !Array.isArray(data.buildings) || !data.buildings.length) throw new Error('返回数据为空');
  try { localStorage.setItem(FALLBACK_KEY, JSON.stringify({ at: Date.now(), buildings: data.buildings.length })); } catch (e) {}
  return data;
}

const SNAPSHOT = await loadSnapshot().catch(err => {
  degradedNotice(String(err && err.message || err));
  throw err;
});

/* 还原成渲染层期望的形状：buildings[].floors[].rooms[] */
const DATA = {
  buildings: SNAPSHOT.buildings.map(b => ({
    id: b.id,
    name: b.name,
    aspect: b.aspect,
    aspAll: b.aspAll,
    floors: b.floors.map(f => ({
      sheet: f.sheet,
      rooms: f.rooms.map(r => ({
        no: r.no || '',
        cat: r.cat,
        label: r.label,
        dept: r.dept || '',
        person: r.person || '',
        notes: r.notes || '',
        lines: r.lines && r.lines.length ? r.lines : [r.label],
        nx: r.nx, nz: r.nz, nw: r.nw, nd: r.nd, frac: r.frac,
        uid: r.uid                       // 服务端下发的稳定键，直接沿用，不再本地推导
      }))
    }))
  }))
};
/* ---------- 写接口：统一入口 ----------
   同源 fetch 会自动带会话 cookie；服务端对写请求校验 Origin + JSON，
   所以这里必须显式带 Content-Type，不能用表单编码。 */
let apiSeq = 0;
async function apiSend(method, path, body){
  const res = await fetch(path, {
    method,
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  let payload = {};
  try { payload = await res.json(); } catch (e) {}
  if (!res.ok){
    const msg = payload && (payload.error || payload.detail) || `HTTP ${res.status}`;
    toastSaveError(msg);
    throw new Error(msg);
  }
  return payload;
}

/* 保存失败提示：角落浮一条，3.6 秒后自己消失。
   不打断当前操作 —— 房间编辑是连续动作，弹模态会让人丢掉上下文 */
let saveErrTimer = 0;
function toastSaveError(text){
  let el = document.getElementById('saveErr');
  if (!el){
    el = document.createElement('div');
    el.id = 'saveErr';
    el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9998;' +
      'background:rgba(180,48,32,.96);color:#fff;font:12.5px/1.5 -apple-system,"PingFang SC",sans-serif;' +
      'padding:9px 16px;border-radius:10px;box-shadow:0 10px 26px rgba(88,22,14,.34);max-width:70vw';
    document.body.appendChild(el);
  }
  el.textContent = `未保存到服务器：${text}`;
  el.style.display = 'block';
  clearTimeout(saveErrTimer);
  saveErrTimer = setTimeout(() => { el.style.display = 'none'; }, 3600);
}

const BUILDINGS = DATA.buildings;

const EXTRA_COLORS = [0x8fb8f0, 0x62cdb0, 0xf0be63, 0xe0a8c4, 0xa9b6c5, 0x9fcfe0];
const CAT = {
  office:  { c:0x5b8fd8, label:'办公室' },
  open:    { c:0x2faa85, label:'开放办公' },
  exec:    { c:0x8f66cf, label:'领导办公室' },
  meeting: { c:0xe0a02a, label:'会议室' },
  front:   { c:0xe0765c, label:'前台 / 大厅' },
  dining:  { c:0xc4702f, label:'餐厅 / 餐厨' },
  guest:   { c:0xc96b9c, label:'客房' },
  fitness: { c:0x36a89e, label:'康体 / 健身' },
  welfare: { c:0xcfa855, label:'员工福利' },
  party:   { c:0xb45e60, label:'党群 / 纪检' },
  archive: { c:0x7a9070, label:'档案室' },
  support: { c:0x8494a8, label:'配套 / 机房' },
  stair:   { c:0xa8b6c8, label:'楼梯 / 安全通道' },
  lift:    { c:0xd79d22, label:'电梯' },
  wc:      { c:0x6aadc8, label:'卫生间' }
};

const FH = 3.4;       // 层高
const GAP = 1.75;     // 剖切模式的层间空隙：要够大才能透出背景，楼层才分离得开
const GAP_SOLID = 0.08;  // 外观模式：楼层几乎相接，由幕墙横梃来分隔，才像真楼
const WALL_H = 1.5;
const WT = 0.11;
const SPAN = 104;   // 每栋楼最长边在场景中的尺度（相对单位，非真实米数）

/* 体量分级：1–4 层保持原平面尺寸当作裙楼，5 层以上收进。
   照片里是下宽上窄的体量，收进后台基/塔楼关系一眼就读得出来；
   4 层以下的房间平面坐标一律不缩放，原有布局与视角完全不变。
   塔楼收窄到 0.54、层高放大 1.46 倍：宽度收、高度涨，整栋才显得修长。
   裙楼层高也抬 1.10 倍（平面尺寸不变）—— 只抬塔楼的话，
   底下四层会显出一截「矮胖的脖子」，整栋反而被压住。
   「外部的框架」也按同一系数收：台基外扩、挑檐外扩、竖挺高度都乘 f.s，
   否则窄塔楼会被一圈厚框罩住，反而更壮。 */
const PODIUM_FLOORS = 4;
/* 底座（1–4 层）与塔楼一起再收 15%：
   裙楼 0.85，塔楼 0.54 × 0.85 = 0.459 —— 两者同比例，塔楼/裙楼的宽窄关系
   （0.54）保持不变，缩的是"整栋的绝对宽度"，不是退台落差。
   退台台阶因此从 48 收到 40.6，仍然读得出下宽上窄。 */
const PODIUM_K = 0.85;
const TOWER_K = 0.459;
const TOWER_FH_K = 1.46;
const PODIUM_FH_K = 1.10;
const floorScale = (fi, b) =>
  (fi < PODIUM_FLOORS || b.floors.length <= PODIUM_FLOORS) ? PODIUM_K : TOWER_K;
/* 层高：裙楼 1.10 倍、塔楼 1.46 倍 */
const floorH = (fi, b) =>
  (fi < PODIUM_FLOORS || b.floors.length <= PODIUM_FLOORS)
    ? FH * PODIUM_FH_K : FH * TOWER_FH_K;

/* 占用状态：从 label / person / notes 里推断，只对办公类房间有意义 */
const OCC = {
  vacant:   { label:'空置可用', c:'#2f9e6b', hex:0x2f9e6b, order:0 },
  pending:  { label:'待腾退',   c:'#d99b3a', hex:0xd99b3a, order:1 },
  borrowed: { label:'借用 / 临时', c:'#c2703f', hex:0xc2703f, order:2 },
  inuse:    { label:'在用',     c:'#9aabbd', hex:0x9aabbd, order:3 }
};
/* 「空置」是占用状态，与功能类别正交：只要不是明确的公共/专用空间都要判定。
   排除项：楼梯、电梯、卫生间、会议室、客房、餐厅、前台、康体、福利间 ——
   这些要么不可占用，要么本身就是公共资源。 */
const NON_OCCUPIABLE = {
  stair:1, lift:1, wc:1, meeting:1, guest:1,
  dining:1, front:1, fitness:1, welfare:1
};
function occupancyOf(r){
  if (NON_OCCUPIABLE[r.cat]) return 'inuse';
  const t = `${r.label} ${r.person} ${r.notes}`;
  if (/待退|待搬|调离/.test(t)) return 'pending';
  if (/借用|临时|挂职|未还/.test(t)) return 'borrowed';
  if (/空房|空置|闲置|预留|放置家具/.test(t)) return 'vacant';
  return 'inuse';
}

/* 类别元数据：数据里没定义时按名字哈希兜底，保证任何数据都能渲染 */
function catInfo(key){
  if (CAT[key]) return CAT[key];
  CAT[key] = { c: EXTRA_COLORS[Object.keys(CAT).length % EXTRA_COLORS.length], label: key };
  return CAT[key];
}
BUILDINGS.forEach(b => b.floors.forEach(f => f.rooms.forEach(r => {
  catInfo(r.cat);
  r.occ = occupancyOf(r);
})));

/* =========================================================
   面积
   —— 原始表只画了格子、没写面积，只有 9F 的 12 间标了「22㎡」。
   —— 所以面积分两类，绝不混淆：
     · 实测面积：从原图标注解析，或人工填写（直接显示 22.0㎡）
     · 折算面积：人工设定「本层房间面积合计」后，按房间占比折算（显示 ≈18.4㎡）
   两者都没有就显示「—」，不留空数字。
   ========================================================= */
const AREA_RE = /(\d+(?:\.\d+)?)\s*(?:㎡|m2|M2|m²|平方米|平米)/;
function parseArea(r){
  const hay = [r.notes, r.label, (r.lines || []).join(' ')].join(' ');
  const m = hay.match(AREA_RE);
  if (!m) return null;
  const v = Number(m[1]);
  return isFinite(v) && v > 0 ? v : null;
}

/* 本层面积合计（人工设定，用于折算） */
const FLOOR_AREA = Object.assign({}, SNAPSHOT.floorAreas || {});
const floorAreaKey = (b, f) => `${b.id}#${f.tag}`;
function floorTotal(b, f){ return toNum(FLOOR_AREA[floorAreaKey(b, f)]); }
function setFloorTotal(b, f, v){
  const k = floorAreaKey(b, f);
  const n = toNum(v);
  const prev = FLOOR_AREA[k];
  if (n === null || n <= 0) delete FLOOR_AREA[k];
  else FLOOR_AREA[k] = n;
  apiSend('PUT', `/api/hq3d/floors/${encodeURIComponent(b.id)}/${encodeURIComponent(f.tag)}/area`,
    { areaTotal: n === null || n <= 0 ? null : n })
    .catch(() => {
      // 失败就回滚内存，别让界面显示一个库里没有的数
      if (prev === undefined) delete FLOOR_AREA[k]; else FLOOR_AREA[k] = prev;
      renderAreaBar && renderAreaBar();
    });
}

/* 取一间房的有效面积：{ v, est } —— est=true 表示是折算值 */
function areaOf(r){
  if (r.area !== null && r.area !== undefined && r.area !== ''){
    const n = toNum(r.area);
    if (n !== null && n > 0) return { v: n, est: false };
  }
  const b = BUILDINGS[r.bi], f = b.floors[r.fi];
  const total = floorTotal(b, f);
  if (total && r.frac > 0) return { v: +(r.frac * total).toFixed(1), est: true };
  return null;
}
function fmtArea(a){
  if (!a) return '—';
  return (a.est ? '≈' : '') + a.v.toFixed(a.v < 100 ? 1 : 0) + ' ㎡';
}
/* 本层面积概览：实测 / 折算 / 未登记 */
function floorAreaStat(b, f){
  let real = 0, est = 0, none = 0, sumReal = 0, sumEst = 0;
  f.rooms.forEach(r => {
    const a = areaOf(r);
    if (!a){ none++; return; }
    if (a.est){ est++; sumEst += a.v; } else { real++; sumReal += a.v; }
  });
  return { real, est, none, sumReal, sumEst };
}

/* =========================================================
   房间资料（可就地修改）
   —— 人员变动、部门调整、房间改名都走这里
   —— 只存「被改过的字段」，原始数据不动，随时能恢复
   ========================================================= */
const ROOM_KEY = 'hq3d.rooms.v1';
const EDITABLE_FIELDS = ['label', 'person', 'dept', 'notes', 'cat', 'area'];
const FIELD_LABEL = { label:'房间名', person:'使用人', dept:'部门',
                      notes:'备注', cat:'功能类别', area:'面积' };
const NUM_FIELDS = { area:1 };

/* 把服务端的 profile 还原成界面期望的形状：
   服务端存 category/areaSqm 与扁平的 history 条目；
   界面用 cat/area 与「一次保存 = 一条 {at,by,changes[]}」。 */
function profileFromServer(p){
  if (!p) return null;
  const out = { updatedAt: p.updatedAt ? Date.parse(p.updatedAt) : 0, history: [] };
  if (p.label !== undefined) out.label = p.label;
  if (p.person !== undefined) out.person = p.person;
  if (p.dept !== undefined) out.dept = p.dept;
  if (p.notes !== undefined) out.notes = p.notes;
  if (p.category !== undefined) out.cat = p.category;
  if (p.areaSqm !== undefined) out.area = p.areaSqm;
  // history 按时间聚回「一次提交」
  const byAt = new Map();
  (p.history || []).forEach(h => {
    const key = h.at || '';
    if (!byAt.has(key)) byAt.set(key, { at: Date.parse(key) || 0, by: h.by || '', changes: [] });
    byAt.get(key).changes.push({ field: h.field, from: h.from, to: h.to });
  });
  out.history = [...byAt.values()].sort((a, b) => a.at - b.at).slice(-30);
  return out;
}

const ROOM_OVR = {};
Object.keys(SNAPSHOT.profiles || {}).forEach(uid => {
  const v = profileFromServer(SNAPSHOT.profiles[uid]);
  if (v) ROOM_OVR[uid] = v;
});

/* 提交改动：只把真正被覆盖的字段发给服务端，其余留空表示「沿用原值」 */
function saveRoomOvr(r){
  if (!r || !r.uid) return;
  const o = ROOM_OVR[r.uid] || {};
  const payload = {};
  EDITABLE_FIELDS.forEach(k => {
    const v = o[k];
    payload[k === 'cat' ? 'category' : k === 'area' ? 'areaSqm' : k] =
      (v === undefined || v === null || v === '') ? null : v;
  });
  apiSend('PUT', `/api/hq3d/rooms/${encodeURIComponent(r.uid)}`, { profile: payload })
    .then(({ profile }) => {
      const back = profileFromServer(profile);
      if (back) ROOM_OVR[r.uid] = back;
      applyRoomOvr(r);
      refreshPane();
    })
    .catch(() => {});
}

/* 把覆盖值刷到房间对象上；没有覆盖的房间保持原始数据 */
function applyRoomOvr(r){
  const o = ROOM_OVR[r.uid];
  if (!o){
    EDITABLE_FIELDS.forEach(k => {
      r[k] = NUM_FIELDS[k] ? toNum(r.orig[k]) : r.orig[k];
    });
    r.occ = occupancyOf(r);
    return false;
  }
  EDITABLE_FIELDS.forEach(k => {
    const v = (o[k] !== undefined && o[k] !== null) ? o[k] : r.orig[k];
    r[k] = NUM_FIELDS[k] ? toNum(v) : v;
  });
  r.occ = occupancyOf(r);
  return true;
}
function toNum(v){
  if (v === '' || v === null || v === undefined) return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}
function hasRoomOvr(r){ return !!ROOM_OVR[r.uid]; }
function roomHistory(r){
  const o = ROOM_OVR[r.uid];
  return (o && o.history) || [];
}
function roomUpdatedAt(r){
  const o = ROOM_OVR[r.uid];
  return o && o.updatedAt ? o.updatedAt : 0;
}

/* 保存一间房的改动：只记真正变了的字段，写进历史 */
function saveRoomInfo(r, patch, by){
  const cur = {};
  EDITABLE_FIELDS.forEach(k => { cur[k] = r[k]; });
  const changes = [];
  EDITABLE_FIELDS.forEach(k => {
    if (patch[k] === undefined) return;
    const from = String(cur[k] == null ? '' : cur[k]).trim();
    const to = String(patch[k] == null ? '' : patch[k]).trim();
    if (from !== to) changes.push({ field: k, from, to });
  });
  if (!changes.length) return null;

  const o = ROOM_OVR[r.uid] || { history: [] };
  const merged = {};
  EDITABLE_FIELDS.forEach(k => { merged[k] = cur[k]; });
  changes.forEach(c => { merged[c.field] = c.to; });

  // 只保留与原始值不同的字段，避免表里堆积无意义条目
  const store = {};
  EDITABLE_FIELDS.forEach(k => {
    const orig = String(r.orig[k] == null ? '' : r.orig[k]).trim();
    const now = String(merged[k] == null ? '' : merged[k]).trim();
    if (now !== orig) store[k] = now;
  });

  const rec = { at: Date.now(), by: by || '', changes };
  const history = (o.history || []).slice(-30).concat([rec]);
  ROOM_OVR[r.uid] = Object.assign({}, store, { updatedAt: rec.at, history });
  if (!Object.keys(store).length && !history.length) delete ROOM_OVR[r.uid];
  saveRoomOvr(r);

  applyRoomOvr(r);
  return rec;
}

/* 恢复原始数据 */
function restoreRoomInfo(r){
  if (!ROOM_OVR[r.uid]) return;
  delete ROOM_OVR[r.uid];
  applyRoomOvr(r);
  apiSend('DELETE', `/api/hq3d/rooms/${encodeURIComponent(r.uid)}`)
    .then(() => refreshPane())
    .catch(() => {});
}


/* =========================================================
   维护记录
   —— 只对会议室与各类办公室开放：楼梯、电梯、卫生间这些不归房间维护流程管
   ========================================================= */
const MAINTAINABLE = { office:1, open:1, exec:1, meeting:1 };
const MNT_TYPES = ['空调', '给排水', '照明', '门禁', '家具', '网络', '消防', '其他'];
const MNT_STATUS = {
  open:  { label:'待处理', c:'#d65440', order:0 },
  doing: { label:'维修中', c:'#d99b3a', order:1 },
  done:  { label:'已完成', c:'#2f9e6b', order:2 }
};
const MNT_KEY = 'hq3d.maintenance.v1';

/* 服务端记录 → 界面记录：reporter→who；ISO 时间→毫秒数（界面会做减法排序） */
function recordFromServer(rec){
  return {
    id: rec.id,
    type: rec.type,
    title: rec.title,
    note: rec.note || '',
    who: rec.reporter || '',
    status: rec.status,
    createdAt: Date.parse(rec.createdAt) || 0,
    updatedAt: Date.parse(rec.updatedAt) || 0
  };
}
const MNT = {};
Object.keys(SNAPSHOT.maintenance || {}).forEach(uid => {

  if (recs.length) MNT[uid] = { records: recs };
});

/* 迁移：房间改名后 uid 不再含 label，旧键（含 label）要重新对齐，
   否则改过名字的房间会「丢记录」。必须在 uid 与 orig 都生成之后调用。 */
function migrateMntKeys(){
  // 数据来自 MySQL 后，键就是服务端 uid，不存在「改名前旧键」需要迁移。
  // 保留为空函数是为了不打断调用处（几何构建前会调一次）。
}
/* 兼容旧调用点：写操作已改为逐条打接口，不再整包落 localStorage */
function saveMnt(){}

const canMaintain = r => !!MAINTAINABLE[r.cat];
const recsOf = r => (MNT[r.key] && MNT[r.key].records) || [];
const activeRecs = r => recsOf(r).filter(x => x.status !== 'done');
function mntState(r){
  const a = activeRecs(r);
  if (!a.length) return 'none';
  return a.some(x => x.status === 'open') ? 'open' : 'doing';
}
function mntLabel(){
  return `报修：${['空调','给排水','照明','门禁','家具','网络','消防','其他'].join(' / ')}`;
}

/* 新增报修：先本地落一条（界面立刻有反应），再提交服务端；
   成功后用服务端返回的 id 替换本地临时 id —— 后续改状态、删除都靠它。 */
function addRecord(r, { type, title, note, who }){
  const tempId = 'tmp' + Date.now().toString(36);
  if (!MNT[r.key]) MNT[r.key] = { records: [] };
  const rec = {
    id: tempId,
    type: type || '其他',
    title: title || (type || '维修') + '报修',
    note: note || '',
    who: who || '',
    status: 'open',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  MNT[r.key].records.push(rec);
  apiSend('POST', `/api/hq3d/rooms/${encodeURIComponent(r.uid)}/maintenance`,
    { record: { type: rec.type, title: rec.title, note: rec.note, reporter: rec.who } })
    .then(({ record }) => {
      Object.assign(rec, recordFromServer(record));
      syncMntVisual(); refreshPane();
    })
    .catch(() => {
      // 落库失败就把这条撤回，避免界面上留一条服务端并不存在的报修
      const recs = recsOf(r);
      const i = recs.findIndex(x => x.id === tempId);
      if (i >= 0) recs.splice(i, 1);
      if (!recsOf(r).length) delete MNT[r.key];
      syncMntVisual(); refreshPane();
    });
  return rec;
}
function setRecordStatus(r, id, status){
  const recs = recsOf(r);
  const rec = recs.find(x => x.id === id);
  if (!rec) return;
  const prev = { status: rec.status, updatedAt: rec.updatedAt };
  rec.status = status;
  rec.updatedAt = Date.now();
  if (id.startsWith('tmp')) return;         // 还没拿到服务端 id，等 POST 回来再改
  apiSend('PATCH', `/api/hq3d/maintenance/${encodeURIComponent(id)}`, { status })
    .then(({ record }) => { Object.assign(rec, recordFromServer(record)); syncMntVisual(); refreshPane(); })
    .catch(() => { rec.status = prev.status; rec.updatedAt = prev.updatedAt; syncMntVisual(); refreshPane(); });
}
function deleteRecord(r, id){
  const recs = recsOf(r);
  const i = recs.findIndex(x => x.id === id);
  if (i < 0) return;
  const [removed] = recs.splice(i, 1);
  if (!recs.length) delete MNT[r.key];
  if (id.startsWith('tmp')) return;
  apiSend('DELETE', `/api/hq3d/maintenance/${encodeURIComponent(id)}`)
    .catch(() => {
      // 删失败就放回来，位置不追求精确
      if (!MNT[r.key]) MNT[r.key] = { records: [] };
      MNT[r.key].records.push(removed);
      syncMntVisual(); refreshPane();
    });
}

/* ---------- 3D 标记：斜纹覆盖层 + 呼吸暖光 ---------- */
const hatchTex = (function makeHatch(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const x = c.getContext('2d');
  x.clearRect(0, 0, 32, 32);
  x.strokeStyle = 'rgba(184,58,38,.95)';
  x.lineWidth = 6;
  x.lineCap = 'butt';
  for (let i = -32; i < 64; i += 11){
    x.beginPath();
    x.moveTo(i, 0);
    x.lineTo(i + 32, 32);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

let mntPulse = [];     // 需要呼吸发光的房间（持续维护中的）

function ensureHatch(r){
  if (r.hatch) return r.hatch;
  const w = Math.max(r.w - 0.5, 0.3);
  const d = Math.max(r.d - 0.5, 0.3);
  const tex = hatchTex.clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // 按 1.2m 一道：太密的斜纹在屏幕上会糊成一层色，反而看不出是斜纹
  tex.repeat.set(Math.max(1, w / 1.2), Math.max(1, d / 1.2));
  const m = new THREE.Mesh(aoPlaneGeo, new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity: .55, depthWrite: false
  }));
  m.rotation.x = -Math.PI / 2;
  m.scale.set(w, d, 1);
  m.position.set(r.cx, TILE_H + 0.04, r.cz);
  m.renderOrder = 4;
  m.visible = false;
  r.mesh.parent.add(m);
  r.hatch = m;
  return m;
}

function syncMntVisual(){
  mntPulse = [];
  BUILDINGS.forEach(b => b.floors.forEach(f => f.rooms.forEach(r => {
    if (!canMaintain(r)) return;
    const st = mntState(r);
    if (st !== 'none'){
      const h = ensureHatch(r);
      h.visible = true;
      h.material.opacity = st === 'open' ? .72 : .5;
      mntPulse.push(r);
    } else if (r.hatch){
      r.hatch.visible = false;
    }
    if (r !== state.selected){
      r.mesh.material.emissive.setHex(OCC[r.occ].hex);
      r.mesh.material.emissiveIntensity = r.occ !== 'inuse' ? .12 : 0;
    }
  })));
  updateMntBadge();
}

function updateVacBadge(){
  const b = curB();
  const n = b.floors.reduce((a, f) => a + f.rooms.filter(r => r.occ !== 'inuse').length, 0);
  const badge = document.getElementById('vacBadge');
  if (!badge) return;
  badge.textContent = n;
  badge.style.background = n ? '#2f9e6b' : '#b6c3d2';
}

function updateMntBadge(){
  const b = curB();
  const n = b.floors.reduce((a, f) => a + f.rooms.filter(r => canMaintain(r) && mntState(r) !== 'none').length, 0);
  const badge = document.getElementById('mntBadge');
  if (!badge) return;
  badge.textContent = n;
  badge.style.background = n ? '#d65440' : '#b6c3d2';
}

/* 预处理：给每栋、每层、每个房间挂上索引与局部坐标 */
BUILDINGS.forEach((b, bi) => {
  b.idx = bi;
  // 按宽高比自适应：长边统一到 SPAN，短边按比例缩，短边下限避免退化成一条线
  if (b.aspect >= 1){ b.FW = SPAN; b.FD = Math.max(5, SPAN / b.aspect); }
  else { b.FD = SPAN; b.FW = Math.max(5, SPAN * b.aspect); }
  // 底座的平面尺度系数：基座、雨棚、广场、退台挑檐都按它算，
  // 否则裙楼缩了、这些附属体还按原始 b.FW 画，会从楼身外沿探出去一大圈
  b.podK = PODIUM_K;
  b.floors.forEach((f, fi) => {
    f.bi = bi; f.fi = fi;
    // 本层体量：4 层以上收进，房间坐标绕本层中心等比缩放 —— 相对关系不变，只是变小
    f.s = floorScale(fi, b);
    f.h = floorH(fi, b);
    f.FW = b.FW * f.s;
    f.FD = b.FD * f.s;
    f.tag = (fi + 1) + 'F';
    f.short = f.sheet.replace(/^(主楼|南配楼)/, '').replace(/（全）/g, '').trim();
    f.rooms.forEach((r, ri) => {
      r.bi = bi; r.fi = fi; r.ri = ri;
      r.x = r.nx * f.FW - f.FW / 2;
      r.z = r.nz * f.FD - f.FD / 2;
      r.w = r.nw * f.FW;
      r.d = r.nd * f.FD;
      r.cx = r.x + r.w / 2;
      r.cz = r.z + r.d / 2;
      // 稳定标识：房间资料与维护记录都靠它跨会话对齐。
      // 必须放在 f.tag 赋值之后；且只由「原始数据」推导 ——
      // 用户改名不能改变 uid，否则一改名字所有关联记录全断。
      // 同一层常有多个同名同号房间（两条安全通道、两部电梯、几间「办公室」）。
      // 只用「楼#层#号#名」会让它们共用同一个键：改一间的资料，另一间跟着变，
      // 维护记录也会串号。第二间起追加序号，保证 uid 层内唯一。
      const uidBase = [b.id, f.tag, r.no || '_', String(r.label).replace(/\s+/g, '')].join('#');
      r.uidBase = uidBase;
      // uid 由服务端下发（已保证层内唯一），这里直接沿用 ——
      // 页面若自己另算一套，改资料时就会写到不存在的键上。
      // 仅在服务端缺值时退回本地推导，保证一条脏数据不会让整层渲染失败。
      r.uid = r.uid || uidBase;
      r.key = r.uid;                       // 兼容旧字段名
      // 原始值快照：「恢复原值」和变更对比都要用
      // 面积：原图里有的直接解析（如「（22㎡）」），没有就留空 —— 不编造
      r.orig = { label: r.label, person: r.person || '', dept: r.dept || '',
                 notes: r.notes || '', cat: r.cat,
                 area: parseArea(r) };
      const mx = r.nx + r.nw / 2, mz = r.nz + r.nd / 2;
      const vi = mz < 0.34 ? 0 : mz > 0.66 ? 2 : 1;
      const hi = mx < 0.34 ? 0 : mx > 0.66 ? 2 : 1;
      r.dir = [['西北角', '北部', '东北角'], ['西侧', '中部', '东侧'], ['西南角', '南部', '东南角']][vi][hi];

      // 资料覆盖必须在 uid 与 orig 都就绪后才能应用
      applyRoomOvr(r);
    });
  });
});

const slabMatBase = new THREE.MeshStandardMaterial({

const edgeMatBase = new THREE.LineBasicMaterial({ color:0xa9bdd6, transparent:true, opacity:.85 });

/* 底座：楼板下的一圈深色台基，把楼层“垫”起来 */
const plinthMatBase = new THREE.MeshStandardMaterial({
