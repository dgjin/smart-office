});
const TILE_H = 0.45;                       // 房间板厚度：侧面要看得见才有体积
const tileGeo = new THREE.BoxGeometry(1, 1, 1);
const aoPlaneGeo = new THREE.PlaneGeometry(1, 1);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

/* 用“向浅灰靠拢”代替降透明度：避免透明混合，暗化后依然是不透明块体 */
const PALE = new THREE.Color(0xd7e1ee);
const SLAB_BASE = new THREE.Color(0xbfcedf);
const SLAB_DARK = new THREE.Color(0x7d8ea6);
function tintRoom(r, k){
  const base = r.mesh.userData.baseColor;
  if (!base) return;
  if (k >= 0.995){
    r.mesh.material.color.copy(base);
  } else {
    r.mesh.material.color.copy(base).lerp(PALE, 1 - k);
  }
}

/* 给房间板注入“边缘内阴影”：顶面越靠近边界越暗，
   等于给每块地板做出倒角与内 AO —— 这是块体感的关键，
   光靠打光是做不出来的（大面积平面上明暗处处相同）。 */
function withEdgeShade(mat, w, d){
  // 内阴影按「米」算，不按 UV 比例：窄房间与宽房间的暗边等宽，
  // 否则狭长楼层（10:1 的板楼）整片发平
  const size = new THREE.Vector2(Math.max(w, 0.001), Math.max(d, 0.001));
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTileSize = { value: size };
    shader.vertexShader = 'varying vec2 vTileUv;\n' + shader.vertexShader.replace(
      '#include <uv_vertex>',
      '#include <uv_vertex>\n  vTileUv = uv;'
    );
    shader.fragmentShader = 'varying vec2 vTileUv;\nuniform vec2 uTileSize;\n' +
      shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
       {
         float _du = min(vTileUv.x, 1.0 - vTileUv.x) * uTileSize.x;
         float _dv = min(vTileUv.y, 1.0 - vTileUv.y) * uTileSize.y;
         float _d = min(_du, _dv);
         float _s = smoothstep(0.0, 0.55, _d);
         diffuseColor.rgb *= mix(0.55, 1.0, _s);
       }`
    );
  };
  mat.customProgramCacheKey = () => 'tile-edge-shade';
  return mat;
}

/* 接地阴影贴图：中心实、边缘软的椭圆，铺在房间板下方 */
const aoTex = (function makeAO(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 6, 64, 64, 62);
  g.addColorStop(0, 'rgba(26,44,72,.62)');
  g.addColorStop(.55, 'rgba(26,44,72,.34)');
  g.addColorStop(1, 'rgba(26,44,72,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const aoMatBase = new THREE.MeshBasicMaterial({
  map: aoTex, transparent: true, opacity: .5, depthWrite: false
});


const world = new THREE.Group();
scene.add(world);

/* 每栋楼一个 group，内部每层一个 group */
// uid / orig 全部就绪：先迁移旧维护键，再进几何构建
migrateMntKeys();

BUILDINGS.forEach(b => {
  b.group = new THREE.Group();
  world.add(b.group);
  b.floors.forEach(f => {
    const g = new THREE.Group();
    g.userData.fi = f.fi;
    g.userData.bi = b.idx;

    const SLAB_T = 0.3;
    const slabGeo = new THREE.BoxGeometry(f.FW, SLAB_T, f.FD);
    const slabMat = slabMatBase.clone();
    const slab = new THREE.Mesh(slabGeo, slabMat);
    slab.position.y = -SLAB_T / 2;
    slab.userData.slabFi = f.fi;
    g.add(slab);

    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(slabGeo), edgeMatBase.clone());
    edge.position.y = -SLAB_T / 2;
    g.add(edge);

    /* 台基：比楼板外扩一点、压暗，形成一圈厚度与投影，楼层不再像一张纸 */
    /* 台基做成四条裙边（中空），只画外露的一圈 —— 实心大盒子的填充面积是纯浪费 */
    const plinthMat = plinthMatBase.clone();
    // 台基外扩与裙边厚度都乘 f.s：塔楼收窄后外框跟着收，不然一圈厚边会把窄体量撑壮
    const PAD = 1.6 * f.s;
    const PW = f.FW + PAD, PD = f.FD + PAD, PH = 0.62 * f.s, PT2 = 0.9 * f.s;
    const plinthGroup = new THREE.Group();
    plinthGroup.position.y = -SLAB_T - PH / 2;
    [
      [0, PD / 2 - PT2 / 2, PW, PT2],
      [0, -PD / 2 + PT2 / 2, PW, PT2],
      [-PW / 2 + PT2 / 2, 0, PT2, PD - PT2 * 2],
      [PW / 2 - PT2 / 2, 0, PT2, PD - PT2 * 2]
    ].forEach(([x, z, w, d]) => {
      const m2 = new THREE.Mesh(new THREE.BoxGeometry(w, PH, d), plinthMat);
      m2.position.set(x, 0, z);
      plinthGroup.add(m2);
    });
    const plinthEdge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(PW, PH, PD)),
      new THREE.LineBasicMaterial({ color:0xa9bad0, transparent:true, opacity:.45 })
    );
    plinthGroup.add(plinthEdge);
    g.add(plinthGroup);
    g.userData.plinthGroup = plinthGroup;

    /* 幕墙竖挺：只在四角与每 1/6 处立细柱，读起来是建筑而不是盒子 */
    const mullMat = new THREE.MeshStandardMaterial({
      color:0xc3d3e6, roughness:.5, metalness:.15, envMapIntensity:.5,
      transparent:true, opacity:.9
    });
    const mullSegs = [];
    const MH = f.h * 0.58;      // 竖挺高度跟层高走，塔楼层高抬高后不能还停在 2.0
    for (let i = 0; i <= 6; i++){
      const x = -f.FW / 2 + (f.FW / 6) * i;
      mullSegs.push({ x, z:-f.FD / 2 }, { x, z:f.FD / 2 });
    }
    for (let i = 1; i < 4; i++){
      const z = -f.FD / 2 + (f.FD / 4) * i;
      mullSegs.push({ x:-f.FW / 2, z }, { x:f.FW / 2, z });
    }
    const mullIm = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.08, MH, 0.08), mullMat, mullSegs.length);
    const mo = new THREE.Object3D();
    mullSegs.forEach((m2, k) => {
      mo.position.set(m2.x, MH / 2, m2.z);
      mo.updateMatrix();
      mullIm.setMatrixAt(k, mo.matrix);
    });
    mullIm.instanceMatrix.needsUpdate = true;
    g.add(mullIm);
    g.userData.mullions = mullIm;

    /* ---------- 整栋模式专属：现代塔楼的读图元素 ---------- */
    /* (a) 楼层腰线：只画水平的一圈，绝不画竖边
       —— 竖边会把 20 层连成一根柱子，这是整栋视图显得笨重的头号原因 */
    // 挑檐做成四条边（中空框）：中间空着，填充面积可忽略；厚度让它在任何缩放下都看得见
    const EAD = 1.5 * f.s;
    const EW = f.FW + EAD, ED = f.FD + EAD, EH = 0.13, ET = 0.5 * f.s;
    const eaveGroup = new THREE.Group();
    const eaveMat = new THREE.MeshStandardMaterial({
      color:0xdceaf8, roughness:.42, metalness:.06, envMapIntensity:.4
    });
    [
      [0, ED / 2 - ET / 2, EW, ET],
      [0, -ED / 2 + ET / 2, EW, ET],
      [-EW / 2 + ET / 2, 0, ET, ED - ET * 2],
      [EW / 2 - ET / 2, 0, ET, ED - ET * 2]
    ].forEach(([x, z, w, d]) => {
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(w, EH, d), eaveMat);
      b2.position.set(x, 0, z);
      eaveGroup.add(b2);
    });
    eaveGroup.position.y = f.h * 0.95;
    g.add(eaveGroup);
    g.userData.glassFrame = eaveGroup;
    g.userData.eaveMat = eaveMat;

    /* (b) 楼层标牌：canvas 贴图 sprite，悬在楼层西北角外侧 */
    if (!b.tagTex) b.tagTex = {};
    const mkTag = (txt) => {
      if (b.tagTex[txt]) return b.tagTex[txt];
      const c = document.createElement('canvas');
      c.width = 128; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 128, 64);
      // 圆角底板
      const r = 14, pad = 4;
      ctx.beginPath();
      ctx.moveTo(pad + r, pad);
      ctx.lineTo(128 - pad - r, pad);
      ctx.quadraticCurveTo(128 - pad, pad, 128 - pad, pad + r);
      ctx.lineTo(128 - pad, 64 - pad - r);
      ctx.quadraticCurveTo(128 - pad, 64 - pad, 128 - pad - r, 64 - pad);
      ctx.lineTo(pad + r, 64 - pad);
      ctx.quadraticCurveTo(pad, 64 - pad, pad, 64 - pad - r);
      ctx.lineTo(pad, pad + r);
      ctx.quadraticCurveTo(pad, pad, pad + r, pad);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,160,210,.85)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#2b4570';
      ctx.font = 'bold 34px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(txt, 64, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      b.tagTex[txt] = tex;
      return tex;
    };
    const tag = new THREE.Sprite(new THREE.SpriteMaterial({
      map: mkTag(f.tag), transparent: true, depthWrite: false, depthTest: false,
      toneMapped: false          // 不参与色调映射，标牌才能保持白底清晰
    }));
    tag.scale.set(3.4, 1.7, 1);
    tag.userData.baseScale = 3.4;
    tag.position.set(-f.FW / 2 - 2.6, f.h * 0.5, f.FD / 2);
    tag.renderOrder = 10;
    g.add(tag);
    g.userData.tag = tag;

    /* (c) 功能构成条：把本层房间按顺序压成一条彩色带，贴在楼层前沿 */
    (function profileStrip(){
      const H = 0.26;
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 12;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(255,255,255,0)';
      ctx.fillRect(0, 0, 1024, 12);
      const sorted = f.rooms.slice().sort((a, c) => a.nx - c.nx);
      const total = Math.max(...sorted.map(r => r.nx + r.nw), 1);
      sorted.forEach(r => {
        const x0 = (r.nx / total) * 1024;
        const x1 = ((r.nx + r.nw) / total) * 1024;
        const col = catInfo(r.cat).c;
        ctx.fillStyle = '#' + col.toString(16).padStart(6, '0');
        ctx.fillRect(x0, 0, Math.max(x1 - x0 - 0.6, 0.6), 12);
      });
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      // 竖直面默认朝向 +Z，正好贴在楼层南侧剖面上，像楼板的一条彩色剖面
      const strip = new THREE.Mesh(
        new THREE.PlaneGeometry(f.FW * 0.9, H),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .92,
                                      depthWrite: false })
      );
      strip.position.set(0, -SLAB_T / 2, f.FD / 2 + 0.015);
      strip.visible = false;
      g.add(strip);
      g.userData.strip = strip;
    })();

    const wallMat = wallMatBase.clone();
    const segs = [];
    f.rooms.forEach(r => {
      const cat = catInfo(r.cat);
      const isCirculation = r.cat === 'stair' || r.cat === 'lift';
      const mat = new THREE.MeshStandardMaterial({
        color: cat.c,
        roughness: .5,
        metalness: .04,
        envMapIntensity: .16,
        transparent: false,
        opacity: 1,
        depthWrite: true,
        emissive: new THREE.Color(OCC[r.occ].hex),
        emissiveIntensity: r.occ !== 'inuse' ? .12 : 0
      });
      // 薄板代替平面：有厚度才有边界感，俯视时房间分隔一眼可辨
      withEdgeShade(mat, Math.max(r.w - 0.5, 0.15), Math.max(r.d - 0.5, 0.15));
      const tile = new THREE.Mesh(tileGeo, mat);
      // 内缩 0.34：房间之间留出可见缝隙，深色楼板透出来 → 每个房间成了独立块体
      tile.scale.set(Math.max(r.w - 0.5, 0.15), TILE_H, Math.max(r.d - 0.5, 0.15));
      tile.position.set(r.cx, TILE_H / 2 + 0.01, r.cz);
      tile.userData.room = r;
      tile.userData.isTile = true;
      tile.userData.baseOpacity = 1;
      tile.userData.baseColor = mat.color.clone();
      tile.userData.baseY = TILE_H / 2 + 0.01;
      g.add(tile);
      r.mesh = tile;

      // 接地阴影：比房间略大一圈，从板下透出柔边
      // 落影：朝主光反方向偏移一点，边缘软化 —— 房间立刻“离地”
      const ao = new THREE.Mesh(aoPlaneGeo, aoMatBase.clone());
      ao.rotation.x = -Math.PI / 2;
      ao.scale.set(Math.max(r.w + 0.5, 0.4), Math.max(r.d + 0.5, 0.4), 1);
      ao.position.set(r.cx + 0.34, 0.004, r.cz + 0.3);
      ao.userData.isAO = true;
      ao.renderOrder = 1;
      g.add(ao);
      r.ao = ao;

      const hw = r.w / 2, hd = r.d / 2;
      segs.push({ x:r.cx, z:r.cz - hd, sx:r.w, sz:WT });
      segs.push({ x:r.cx, z:r.cz + hd, sx:r.w, sz:WT });
      segs.push({ x:r.cx - hw, z:r.cz, sx:WT, sz:r.d });
      segs.push({ x:r.cx + hw, z:r.cz, sx:WT, sz:r.d });
    });

    const im = new THREE.InstancedMesh(boxGeo, wallMat, segs.length);
    const capIm = new THREE.InstancedMesh(boxGeo, capMatBase.clone(), segs.length);
    const o = new THREE.Object3D();
    const o2 = new THREE.Object3D();
    segs.forEach((s, k) => {
      const sx = Math.max(s.sx, 0.05), sz = Math.max(s.sz, 0.05);
      o.position.set(s.x, WALL_H / 2, s.z);
      o.scale.set(sx, WALL_H, sz);
      o.updateMatrix();
      im.setMatrixAt(k, o.matrix);

      // 墙顶一条 6cm 亮边，边界立刻清晰
      o2.position.set(s.x, WALL_H - 0.03, s.z);
      o2.scale.set(sx + 0.012, 0.06, sz + 0.012);
      o2.updateMatrix();
      capIm.setMatrixAt(k, o2.matrix);
    });
    im.instanceMatrix.needsUpdate = true;
    capIm.instanceMatrix.needsUpdate = true;
    capIm.castShadow = false;
    g.add(im);
    g.add(capIm);

    g.userData.mats = { slab:slabMat, edge:edge.material, wall:wallMat, walls:im,
                        caps:capIm, plinth:plinthMat };
    b.group.add(g);
    f.group = g;
  });
});

/* =========================================================
   办公家具：按房间功能摆对应的用具
   —— 每个房间按类别生成「盒子 / 柱体 / 球体」三类基元，全层共用 3 个
      InstancedMesh，颜色走 instanceColor：一层几百件家具也只 3 个 draw call。
   —— 懒构建：只给要显示的那一层生成，切层时才付这一次代价。
   ========================================================= */
const FURN_MAT = {
  box: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.64, metalness:.06, envMapIntensity:.24 }),
  cyl: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.40, metalness:.30, envMapIntensity:.34 }),
  sph: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.92, metalness:0, envMapIntensity:.16 })
};
const FURN_GEO = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 10),
  sph: new THREE.SphereGeometry(1, 10, 8)
};
/* 家具配色：比房间色板低饱和一档 —— 家具是内容，不是色块 */
const FC = {
  top:    0xdbcbb0,   // 桌面木色
  topDk:  0xb99b73,
  body:   0x93a0ad,   // 桌柜钢灰
  chair:  0x3d4a58,
  fab:    0x6d7f92,
  sofa:   0x54697d,
  wood:   0x9c7a4e,
  dark:   0x333c47,
  metal:  0xb0bac5,
  screen: 0x1f2b3a,
  leaf:   0x4d7a44,
  pot:    0x9a8971,
  white:  0xeef3f8,
  red:    0xbf5240,
  blue:   0x3f6fa8,
  mat:    0x546a68,
  equip:  0x53606e,
  glass:  0x9dc3d8
};
const furnDummy = new THREE.Object3D();
const furnCol = new THREE.Color();

/* 房间能摆多少工位：优先用名称里的「N人」，没有就按面积估 */
function seatCap(r){
  const m = /(\d+)\s*人/.exec(`${r.label} ${r.notes || ''}`);
  return m ? Math.min(Number(m[1]), 60) : 0;
}
function localFn(px, pz, ry){
  const c = Math.cos(ry), s = Math.sin(ry);
  return (dx, dz) => [px + dx * c - dz * s, pz + dx * s + dz * c];
}

function buildFurniture(f){
  if (f.furn) return f.furn;
  const yb = TILE_H + 0.02;
  const B = [], C = [], P = [];
  const box = (x, y, z, sx, sy, sz, col, ry = 0) => B.push([x, y, z, sx, sy, sz, col, ry]);
  const cyl = (x, y, z, rad, h, col) => C.push([x, y, z, rad, h, col]);
  const sph = (x, y, z, rad, col, sy = 1) => P.push([x, y, z, rad, col, sy]);

  const plant = (x, z, k = 1) => {
    cyl(x, yb, z, 0.24 * k, 0.34 * k, FC.pot);
    sph(x, yb + 0.62 * k, z, 0.36 * k, FC.leaf, 1.05);
    sph(x + 0.16 * k, yb + 0.80 * k, z - 0.12 * k, 0.24 * k, 0x5f8d4b, 1.0);
  };
  const chair = (x, z, ry = 0, col = FC.chair) => {
    const L = localFn(x, z, ry);
    let p = L(0, 0);
    box(p[0], yb + 0.38, p[1], 0.48, 0.09, 0.46, col, ry);
    p = L(0, -0.21);
    box(p[0], yb + 0.42, p[1], 0.48, 0.50, 0.08, col, ry);
    p = L(0, 0.01);
    cyl(p[0], yb + 0.18, p[1], 0.05, 0.36, FC.metal);
  };
  const desk = (x, z, ry = 0, w = 1.55, d = 0.74, person = true, screen = true) => {
    const L = localFn(x, z, ry);
    let p = L(0, 0);
    box(p[0], yb + 0.70, p[1], w, 0.07, d, FC.top, ry);
    p = L(w * 0.31, 0);
    box(p[0], yb + 0.34, p[1], 0.44, 0.66, d * 0.84, FC.body, ry);   // 侧柜
    if (screen){
      p = L(0, -d * 0.30);
      box(p[0], yb + 0.84, p[1], Math.min(0.52, w * 0.42), 0.32, 0.04, FC.screen, ry);
    }
    if (person){
      p = L(0, d * 0.86);
      chair(p[0], p[1], ry + Math.PI);
    }
  };
  const sofa = (x, z, ry = 0, w = 1.9) => {
    const L = localFn(x, z, ry);
    let p = L(0, 0);
    box(p[0], yb + 0.20, p[1], w, 0.42, 0.78, FC.sofa, ry);            // 座
    p = L(0, -0.34);
    box(p[0], yb + 0.56, p[1], w, 0.68, 0.16, FC.sofa, ry);            // 靠背
    p = L(-w / 2 + 0.08, 0);
    box(p[0], yb + 0.34, p[1], 0.18, 0.44, 0.76, FC.fab, ry);          // 扶手
    p = L(w / 2 - 0.08, 0);
    box(p[0], yb + 0.34, p[1], 0.18, 0.44, 0.76, FC.fab, ry);
  };
  const lowTable = (x, z, w = 1.5, d = 0.8) => {
    box(x, yb + 0.40, z, w, 0.07, d, FC.wood);
    cyl(x, yb, z, 0.10, 0.40, FC.dark);
  };
  const cabinet = (x, z, ry = 0, w = 2.2, h = 1.35, d = 0.46) =>
    box(x, yb, z, w, h, d, FC.body, ry);

  f.rooms.forEach(r => {
    const iw = r.w - 0.62, id = r.d - 0.62;
    if (iw < 0.9 || id < 0.9) return;
    const cx = r.cx, cz = r.cz;
    const cat = r.cat;
    const area = iw * id;

    if (cat === 'office' || cat === 'exec' || cat === 'party'){
      /* 个人办公室：只摆一套办公桌椅（按领导办公室布置）。
         之前按「N人」铺工位网格，一层几百张桌子既看不出是单间，也吃帧率；
         单间就该是一张桌子 + 一把椅子，在房间里的位置还得像有人用：
         桌子靠里侧偏窗，椅子在桌前，背后留出走动空间。 */
      const dw = Math.min(Math.max(iw * 0.46, 1.5), 3.0);
      const dd = Math.min(Math.max(id * 0.30, 0.66), 1.1);
      const dxx = cx + iw * 0.06;
      const dzz = cz + id * 0.04;
      box(dxx, yb + 0.74, dzz, dw, 0.10, dd, FC.topDk);                  // 台面
      box(dxx, yb + 0.34, dzz, dw * 0.90, 0.68, dd * 0.62, FC.wood);     // 台身
      box(dxx, yb + 0.02, dzz, dw * 0.34, 0.68, dd * 0.30, FC.dark);     // 挡板
      chair(dxx, dzz + dd * 0.92, Math.PI, 0x2f3945);                    // 一把椅子
      if (cat === 'party'){
        // 党群活动室：除桌椅外保留一面宣传板（不是家具，是房间功能标识）
        box(cx, yb, r.z + 0.42, Math.min(iw * 0.6, 3.0), 1.9, 0.14, FC.red, 0);
      }
    } else if (cat === 'open'){
      // 开放办公：长条工位岛，两排对坐。岛数与每岛座位数都按面积收敛，
      // 否则一整层开放办公会生成上千件家具，软件渲染下帧率直接掉一半
      const nSeat = Math.min(24, seatCap(r) || Math.round(area / 6));
      const perIsland = Math.max(2, Math.min(4, Math.round(iw / 3.4)));
      const islands = Math.max(1, Math.ceil(nSeat / (perIsland * 2)));
      const cols = Math.max(1, Math.min(islands, Math.round(Math.sqrt(islands * (iw / id)) + 0.4)));
      const irows = Math.ceil(islands / cols);
      const island = Math.min((iw - 1.6) / cols - 1.2, 7.2);
      const stepX = (iw - 0.6) / cols, stepZ = (id - 1.2) / Math.max(1, irows);
      for (let i = 0; i < irows; i++){
        for (let j = 0; j < cols; j++){
          if (i * cols + j >= islands) break;
          const bx = r.x + 0.3 + stepX * (j + 0.5);
          const bz = r.z + 0.6 + stepZ * (i + 0.5);
          box(bx, yb + 0.70, bz, island, 0.08, 1.05, FC.top);
          box(bx, yb + 0.30, bz, island * 0.92, 0.62, 0.16, FC.body);
          const per = Math.max(2, Math.round(island / 1.7));
          for (let q = 0; q < per; q++){
            const dx = -island / 2 + 0.85 + (island - 1.7) / Math.max(1, per - 1) * q;
            box(bx + dx, yb + 0.84, bz - 0.36, 0.46, 0.30, 0.04, FC.screen);
            chair(bx + dx, bz + 0.86, Math.PI);
            if (per > 2) chair(bx + dx, bz - 0.86, 0);
          }
        }
      }
      if (area > 40) plant(r.x + 0.9, r.z + 0.9, 1.1);
    } else if (cat === 'meeting'){
      // 会议室：长桌 + 一圈椅子 + 侧墙投屏
      const tw = Math.min(iw * 0.62, 4.6), td = Math.min(id * 0.44, 1.7);
      box(cx, yb + 0.72, cz, tw, 0.08, td, FC.top);
      box(cx, yb + 0.36, cz, tw * 0.25, 0.70, td * 0.5, FC.wood);
      const nSide = Math.max(2, Math.floor(tw / 1.05));
      for (let i = 0; i < nSide; i++){
        const dx = -tw / 2 + 0.52 + (tw - 1.04) / Math.max(1, nSide - 1) * i;
        chair(cx + dx, cz + td / 2 + 0.62, Math.PI);
        chair(cx + dx, cz - td / 2 - 0.62, 0);
      }
      if (td > 2.1){ chair(cx - tw / 2 - 0.62, cz, Math.PI / 2); }
      // 投屏（贴北墙）
      box(cx, yb + 1.15, r.z + 0.42, Math.min(tw * 0.8, 2.6), 1.15, 0.07, FC.screen);
      if (area > 20) plant(r.x + 0.8, r.z + 0.8, 0.9);
    } else if (cat === 'front'){
      // 前台 / 大厅：接待台 + 背景墙 + 等候沙发
      const w2 = Math.min(iw * 0.45, 4.2);
      box(cx, yb + 1.02, cz + id * 0.10, w2, 0.10, 0.95, FC.white);
      box(cx, yb + 0.50, cz + id * 0.10, w2 * 0.96, 1.00, 0.80, 0x8b7a63);
      box(cx, yb + 1.06, r.z + 0.42, Math.min(iw * 0.55, 5.0), 1.9, 0.10, FC.blue);
      sofa(cx - iw * 0.28, cz + id * 0.30, Math.PI, Math.min(iw * 0.28, 2.4));
      sofa(cx + iw * 0.28, cz + id * 0.30, Math.PI, Math.min(iw * 0.28, 2.4));
      lowTable(cx, cz + id * 0.22, 1.5, 0.9);
      plant(r.x + 0.85, r.z + 0.85, 1.2);
      plant(r.x + r.w - 0.85, r.z + 0.85, 1.2);
    } else if (cat === 'dining'){
      // 餐厅：圆桌 + 四椅 + 备餐台
      const n = Math.max(1, Math.min(8, Math.floor(area / 13)));
      const cols = Math.max(1, Math.round(Math.sqrt(n)));
      for (let i = 0; i < n; i++){
        const gx = cx + ((i % cols) - (cols - 1) / 2) * Math.min(iw / cols, 3.4);
        const gz = cz + (Math.floor(i / cols) - 0.5) * Math.min(id / 2, 3.2);
        cyl(gx, yb + 0.70, gz, 0.78, 0.08, FC.top);
        cyl(gx, yb, gz, 0.09, 0.70, FC.dark);
        chair(gx - 0.95, gz, Math.PI / 2); chair(gx + 0.95, gz, -Math.PI / 2);
        chair(gx, gz - 0.95, 0); chair(gx, gz + 0.95, Math.PI);
      }
      box(cx, yb, r.z + 0.5, Math.min(iw * 0.7, 4), 0.92, 0.6, FC.metal);
    } else if (cat === 'guest'){
      // 客房：床 + 床头柜 + 书桌 + 行李凳
      const bw = Math.min(iw * 0.5, 1.85), bd = Math.min(id * 0.55, 2.15);
      const bx = cx - iw * 0.12, bz = cz + id * 0.08;
      box(bx, yb + 0.28, bz, bw, 0.34, bd, 0x6d5b46);                       // 床架
      box(bx, yb + 0.48, bz, bw - 0.10, 0.22, bd - 0.10, 0xf0efe8);         // 床垫
      box(bx, yb + 0.62, bz - bd * 0.34, bw - 0.24, 0.16, 0.52, 0xdfe6ee);  // 枕头区
      box(bx, yb + 0.02, bz, bw, 1.02, 0.12, 0x7d6a52);                     // 床头板
      box(bx - bw / 2 - 0.42, yb, bz - bd * 0.4, 0.52, 0.5, 0.42, FC.wood);  // 床头柜
      box(bx + bw / 2 + 0.42, yb, bz - bd * 0.4, 0.52, 0.5, 0.42, FC.wood);
      if (iw > 4.5) desk(cx + iw * 0.28, cz + id * 0.35, 0, 1.3, 0.62, true, false);
      box(cx, yb, cz + id * 0.44, Math.min(iw * 0.35, 1.2), 0.42, 0.5, FC.fab);
    } else if (cat === 'fitness'){
      // 康体：跑步机 + 动感单车 + 哑铃架 + 垫子 + 镜面墙
      const nT = Math.max(1, Math.min(3, Math.floor(iw / 3.2)));
      for (let i = 0; i < nT; i++){
        const tx = cx - ((nT - 1) * 3.2) / 2 + i * 3.2, tz = cz - id * 0.18;
        box(tx, yb + 0.16, tz, 1.05, 0.30, 2.1, FC.equip);                 // 机座
        box(tx, yb + 0.34, tz + 0.25, 0.80, 0.06, 1.5, 0x24292f);          // 跑带
        box(tx, yb + 0.62, tz - 0.95, 0.10, 0.95, 0.10, FC.metal);         // 立柱
        box(tx, yb + 1.10, tz - 0.95, 0.86, 0.34, 0.16, FC.dark);          // 控制台
        box(tx, yb + 0.86, tz - 0.88, 0.9, 0.06, 0.10, FC.metal);          // 扶手
      }
      // 单车
      const bkx = cx + iw * 0.28, bkz = cz + id * 0.12;
      box(bkx, yb + 0.10, bkz, 1.0, 0.20, 0.42, FC.dark);
      box(bkx, yb + 0.52, bkz, 0.34, 0.34, 0.30, FC.equip);
      box(bkx, yb + 0.78, bkz + 0.28, 0.12, 0.55, 0.12, FC.metal);
      // 哑铃架
      box(cx - iw * 0.30, yb, cz + id * 0.34, 2.0, 0.55, 0.5, FC.equip);
      for (let i = 0; i < 5; i++) cyl(cx - iw * 0.30 - 0.8 + i * 0.4, yb + 0.58, cz + id * 0.34, 0.11, 0.22, FC.metal);
      // 镜面墙 + 地垫
      box(cx, yb + 1.1, r.z + 0.40, Math.min(iw * 0.8, 4.6), 1.5, 0.06, FC.glass);
      box(cx, yb - 0.01, cz + id * 0.30, Math.min(iw * 0.6, 3.2), 0.05, 1.4, FC.mat);
    } else if (cat === 'welfare'){
      // 员工福利：休息沙发 + 茶几 + 储物柜 + 绿植
      sofa(cx - iw * 0.2, cz + id * 0.2, Math.PI, Math.min(iw * 0.34, 2.2));
      sofa(cx + iw * 0.24, cz - id * 0.1, Math.PI / 2, Math.min(id * 0.4, 2.0));
      lowTable(cx, cz + id * 0.12, 1.4, 0.8);
      box(cx, yb, r.z + 0.5, Math.min(iw * 0.8, 4.0), 1.6, 0.42, FC.body);   // 储物柜
      plant(r.x + 0.85, r.z + 0.85, 1.0);
    } else if (cat === 'archive'){
      // 档案室：密集架成排
      const rows = Math.max(1, Math.floor((id - 0.4) / 1.5));
      const sw = Math.min(iw - 0.4, 6);
      for (let i = 0; i < rows; i++){
        const sz = cz - ((rows - 1) * 1.5) / 2 + i * 1.5;
        box(cx, yb, sz, sw, 1.85, 0.62, 0x7f8a96);
        box(cx, yb + 1.86, sz, sw + 0.08, 0.10, 0.68, 0x606b77);
      }
    } else if (cat === 'support'){
      // 配套 / 机房：机柜阵列 + 空调 + 货箱。
      // 库房常是又窄又长的整条，机柜要沿长轴排，否则全挤在中间
      const along = id > iw * 1.6 ? 'z' : 'x';
      const len = along === 'z' ? id : iw;
      const n = Math.max(2, Math.min(8, Math.floor(len / 1.5)));
      for (let i = 0; i < n; i++){
        const t = len * (0.12 + 0.76 * i / Math.max(1, n - 1)) - len / 2;
        const rx = along === 'z' ? cx : r.x + len / 2 + t;
        const rz = along === 'z' ? r.z + len / 2 + t : cz;
        box(rx, yb, rz, 0.95, 2.0, 0.85, 0x39424e);
        box(rx, yb + 0.35, rz + 0.45, 0.75, 0.06, 0.04, 0x4f8fd6);   // 状态灯带
        box(rx, yb + 0.55, rz + 0.45, 0.75, 0.06, 0.04, 0x4f8fd6);
        box(rx, yb + 1.60, rz + 0.45, 0.75, 0.06, 0.04, 0x6fbf8f);
      }
      box(cx, yb + 1.0, r.z + 0.42, 1.1, 1.2, 0.5, 0xd7dce2);          // 壁挂空调
      box(cx + iw * 0.32, yb, cz + id * 0.3, 0.8, 0.7, 0.8, 0xa08b6c); // 货箱
      box(cx - iw * 0.30, yb, cz - id * 0.3, 0.9, 0.55, 0.7, 0xb5a184); // 第二个货箱
    } else if (cat === 'stair'){
      // 楼梯：踏步沿 z 上升，一眼读出「这是竖向交通」
      const n = Math.max(4, Math.min(12, Math.floor(id / 0.42)));
      const sw = Math.min(iw * 0.8, 1.6);
      for (let i = 0; i < n; i++){
        box(cx, yb, r.z + 0.4 + i * 0.42, sw, 0.10 + i * 0.13, 0.42, 0xdfe6ee);
      }
    } else if (cat === 'lift'){
      // 电梯：轿厢地面 + 两扇门
      box(cx, yb - 0.01, cz, Math.max(iw - 0.3, 0.4), 0.04, Math.max(id - 0.3, 0.4), 0x9aa6b3);
      box(cx - Math.max(iw - 0.3, 0.4) / 4 - 0.02, yb, cz + id * 0.42, Math.max(iw - 0.3, 0.4) / 2 - 0.04, 1.4, 0.06, FC.metal);
      box(cx + Math.max(iw - 0.3, 0.4) / 4 + 0.02, yb, cz + id * 0.42, Math.max(iw - 0.3, 0.4) / 2 - 0.04, 1.4, 0.06, FC.metal);
    } else if (cat === 'wc'){
      // 卫生间：隔间 + 台盆
      const n = Math.max(2, Math.min(4, Math.floor(iw / 1.0)));
      for (let i = 0; i < n; i++){
        const sx = r.x + 0.5 + i * ((iw - 0.4) / n);
        box(sx, yb, r.z + 0.9, 0.06, 1.25, 1.1, 0xdfe7ee);
        box(sx, yb, r.z + 1.45, (iw - 0.4) / n, 1.25, 0.06, 0xdfe7ee);
      }
      box(cx, yb + 0.78, cz + id * 0.32, Math.min(iw * 0.7, 2.4), 0.12, 0.42, FC.white);
    }
  });

  /* 打包成 3 个 InstancedMesh */
  const grp = new THREE.Group();
  grp.name = 'furniture';
  const packs = [['box', B], ['cyl', C], ['sph', P]];
  packs.forEach(([k, arr]) => {
    if (!arr.length) return;
    const im = new THREE.InstancedMesh(FURN_GEO[k], FURN_MAT[k], arr.length);
    arr.forEach((a, i) => {
      if (k === 'box'){
        furnDummy.position.set(a[0], a[1] + a[4] / 2, a[2]);
        furnDummy.rotation.set(0, a[7], 0);
        furnDummy.scale.set(Math.max(a[3], 0.01), Math.max(a[4], 0.01), Math.max(a[5], 0.01));
      } else if (k === 'cyl'){
        furnDummy.position.set(a[0], a[1] + a[4] / 2, a[2]);
        furnDummy.rotation.set(0, 0, 0);
        furnDummy.scale.set(Math.max(a[3], 0.01), Math.max(a[4], 0.01), Math.max(a[3], 0.01));
      } else {
        furnDummy.position.set(a[0], a[1], a[2]);
        furnDummy.rotation.set(0, 0, 0);
        furnDummy.scale.set(a[3], a[3] * a[5], a[3]);
      }
      furnDummy.updateMatrix();
      im.setMatrixAt(i, furnDummy.matrix);
      im.setColorAt(i, furnCol.setHex(k === 'sph' ? a[4] : a[k === 'cyl' ? 5 : 6]));
    });
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;     // 一层的家具分布在整个楼板，包围盒没必要重算
    grp.add(im);
  });
  f.group.add(grp);
  f.furn = grp;
  return grp;
}

/* =========================================================
   建筑外观：玻璃幕墙 + 屋顶
   —— 一面幕墙只用 1 个平面，横梃/竖梃/层间实心带全部在着色器里画。
      3 个 draw call 换一整套幕墙细节，比堆几何体便宜得多。
   —— 玻璃用 Fresnel：正视近乎透明（能看见室内），掠射接近镜面。
      这正是真玻璃的读法，也是「像真楼」的关键。
   ========================================================= */
const FACADE_VERT = `
  varying vec2 vUv;
  varying vec3 vWorld;
  void main(){
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const FACADE_FRAG = `
  precision highp float;
  uniform float uPitch;      // 楼层间距（世界单位）
  uniform float uCols;       // 竖肋数量
  uniform float uSpandrel;
  uniform vec3  uGlass;      // 玻璃基色（照片实测 #0d1128 附近）
  uniform vec3  uFin;        // 竖肋金属色（照片实测近白 #eef4f4）
  uniform float uInterior;
  uniform vec3  uSunDir;
  uniform vec3  uSkyLo;      // 地平线天空色
  uniform vec3  uSkyHi;      // 天顶天空色
  varying vec2 vUv;
  varying vec3 vWorld;

  void main(){
    vec3 N = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    vec3 V = normalize(cameraPosition - vWorld);
    float facing = abs(dot(V, N));

    // 面方向光：照片里两面亮度差 3 倍以上（L=35 vs 111），这是体量的来源
    float ndl = max(dot(N, normalize(uSunDir)), 0.0);
    // 照片里背光面 L=35、受光面 L=111，明暗比 3:1 → 环境底噪必须压得很低。
    // n^1.25 用 n*n^0.25 的多项式近似，避免满屏 pow
    float n2 = ndl * ndl;
    float ndl125 = ndl * (0.75 + 0.25 * n2) * (0.5 + 0.5 * ndl) + 0.25 * n2;
    ndl125 = clamp(ndl125, 0.0, 1.0);
    float shade = 0.085 + 0.915 * ndl125;

    // 层间带：按世界高度对齐真实楼板
    float fh = vWorld.y / uPitch;
    float fy = fract(fh);
    float spandrel = smoothstep(uSpandrel + 0.02, uSpandrel - 0.02, fy);
    float slabLine = smoothstep(0.06, 0.0, fy);

    // 密集竖向金属肋：照片中周期稳定 4px，是这座楼最强的识别特征。
    // 肋只占每格边缘约 28%，中间是深色玻璃槽 —— 覆盖太宽整面就成了金属灰
    float mx = fract(vUv.x * uCols);
    float fin = smoothstep(0.215, 0.085, min(mx, 1.0 - mx));
    float finCore = smoothstep(0.075, 0.03, abs(mx - 0.5));

    // 玻璃反射：深色镀膜玻璃，正视几乎看不见内部，掠射反射天空
    float f1 = 1.0 - facing;
    float fres = f1 * f1 * f1;          // (1-facing)^3，避免 pow
    vec3 R = reflect(-V, N);
    vec3 sky = mix(uSkyLo, uSkyHi, clamp(R.y * 1.1 + 0.30, 0.0, 1.0));

    vec3 glass = uGlass * shade * (0.55 + 0.45 * facing)
               + sky * (0.04 + 0.62 * fres) * (0.12 + 0.88 * ndl);

    // 肋面：受光时接近纯白，背光时落成深灰 —— 照片里就是这个全范围交替
    vec3 finCol = uFin * mix(0.30, 1.0, ndl) * (0.64 + 0.36 * facing);

    vec3 col = mix(glass, finCol * 0.60, spandrel);
    col = mix(col, finCol * (1.0 + finCore * 0.55), fin);
    col *= (1.0 - slabLine * 0.45);

    // 镀膜玻璃近乎不透明：留一点室内感即可。原来 0.47 的 alpha
    // 会让明亮室内透上来，把深色玻璃冲成灰色
    float a = mix(0.90 - 0.12 * uInterior, 0.99, fres);
    a = max(a, spandrel * 0.94);
    a = max(a, fin * 0.99);
    a = max(a, finCore * 0.99);

    gl_FragColor = vec4(col, a);

    // ShaderMaterial 不会自动接色彩管线：不补这两行，
    // 线性值会被当成 sRGB 直接显示，整栋发灰发白
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

/* 照片实测配色：深色镀膜玻璃 + 近白金属肋 + 左浅右深的天空 */
const PH = {
  glass:   new THREE.Color(0x5a6474),
  fin:     new THREE.Color(0xeef4f4),
  skyLo:   new THREE.Color(0xabcaE6),   // 地平线偏暖浅蓝
  skyHi:   new THREE.Color(0x2a60ba),   // 天顶深蓝
  // 太阳放在相机侧后：可见的南面受光、东面落影。
  // 若光与相机同侧，两个可见面都亮，整栋就没有体量（这是最初的问题）
  sun:     new THREE.Vector3(0.66, 0.34, -0.62).normalize()
};

/* 屋顶标识用的徽标：把用户提供的 logo3.png（115×102，纯 #004f99 单色 + 透明底）
   按 alpha 通道矢量化成路径（外轮廓 75 点 + 竖标 10 点 + 内孔 23 点，容差 0.75px，
   与原始位图逐像素比对 0.59% 差异，全在边缘一像素内）。
   矢量的好处：放大到招牌尺寸不出马赛克，且可以整体换成金色。
   坐标空间 86×85（原图裁掉留白后的紧凑框）。 */
const LOGO_PATH = 'M2 0L55 0L55 1L60 2L66 8L67 13L68 13L68 47L67 47L66 54L64 55L64 57L62 58L62 60L60 62L58 62L57 64L55 64L53 66L50 66L50 67L36 67L36 66L33 66L33 65L29 64L22 57L22 55L20 53L20 50L19 50L19 44L18 44L19 36L20 36L20 33L21 33L22 29L24 28L24 26L26 24L28 24L32 20L35 20L35 19L38 19L38 18L48 18L48 19L50 19L50 36L48 36L47 34L40 34L40 35L38 35L35 38L35 41L34 41L34 45L35 45L35 48L37 50L39 50L41 52L48 51L51 48L51 46L52 46L52 18L50 16L19 16L19 15L16 15L2 1ZM70 0L86 0L86 84L84 84L73 73L73 71L71 69L71 66L70 66L70 1ZM2 2L14 14L14 16L16 18L16 67L17 67L17 69L19 69L19 70L68 70L68 71L71 71L84 85L12 85L12 84L6 82L4 80L4 78L2 77L1 69L0 69L0 2L1 2Z';
const LOGO_BOX = { w: 86, h: 85 };

function makeFacadeMaterial(b, floors, sideWidth){
  // 肋距 3.2 个单位：照片里右立面 11 根肋、周期 4px，换算到本模型约此密度
  const cols = Math.max(5, Math.round(sideWidth / 3.2));
  return new THREE.ShaderMaterial({
    uniforms: {
      uPitch:    { value: FH + GAP_SOLID },
      uCols:     { value: cols },
      uSpandrel: { value: 0.20 },
      uGlass:    { value: PH.glass.clone() },
      uFin:      { value: PH.fin.clone() },
      uInterior: { value: 1.0 },
      uSunDir:   { value: PH.sun.clone() },
      uSkyLo:    { value: PH.skyLo.clone() },
      uSkyHi:    { value: PH.skyHi.clone() }
    },
    vertexShader: FACADE_VERT,
    fragmentShader: FACADE_FRAG,
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide    // 法线全部朝外，双面渲染等于白付一倍填充
  });
}

/* 立面分段建：1–4 层（裙楼）与 5 层以上（塔楼）各一组平面 + 角柱。
   每组平面都用「单位高度 + 缩放」，层间空隙变化时只改 scale.y，
   不会像固定高度几何那样在剖切模式下与楼层脱开。
   分段的意义：体量在 4 层有一处收进，立面必须跟着台阶走，
   否则幕墙会把八层楼一起罩在一张皮里，退台就看不出来了。 */
BUILDINGS.forEach(b => {
  const facade = new THREE.Group();
  facade.visible = false;

  const planeGeo = new THREE.PlaneGeometry(1, 1);
  planeGeo.translate(0, 0.5, 0);          // 底边落到 y=0，缩放即总高

  const colMat = new THREE.MeshStandardMaterial({
    color: 0xb9c8d9, roughness: .35, metalness: .55, envMapIntensity: .7
  });
  const colGeo = new THREE.BoxGeometry(0.45, 1, 0.45);
  colGeo.translate(0, 0.5, 0);

  b.facadeMats = [];
  b.facadeTiers = [];

  const segs = [];
  const podN = Math.min(PODIUM_FLOORS, b.floors.length);
  segs.push({ f0: 0, nF: podN, k: PODIUM_K });
  if (b.floors.length > PODIUM_FLOORS)
    segs.push({ f0: PODIUM_FLOORS, nF: b.floors.length - PODIUM_FLOORS, k: TOWER_K });
  b.towerK = segs[segs.length - 1].k;

  segs.forEach(seg => {
    const FW = b.FW * seg.k, FD = b.FD * seg.k;
    // 幕墙离楼板的外皮距离也乘 k：塔楼收窄后若还留 0.30 的皮，立面会比楼板宽出一圈
    const SK = 0.30 * seg.k;
    const OX = FW / 2 + SK, OZ = FD / 2 + SK;
    const tier = { f0: seg.f0, nF: seg.nF, k: seg.k, mats: [], pitch: FH + GAP_SOLID, base: 0, height: FH };
    [
      { w: FW + SK * 2, pos: [0, 0, OZ],  rot: [0, 0, 0] },              // 南
      { w: FW + SK * 2, pos: [0, 0, -OZ], rot: [0, Math.PI, 0] },        // 北
      { w: FD + SK * 2, pos: [OX, 0, 0],  rot: [0, Math.PI / 2, 0] },    // 东
      { w: FD + SK * 2, pos: [-OX, 0, 0], rot: [0, -Math.PI / 2, 0] }    // 西
    ].forEach(sd => {
      const mat = makeFacadeMaterial(b, seg.nF, sd.w);
      const m = new THREE.Mesh(planeGeo, mat);
      m.position.set(sd.pos[0], sd.pos[1], sd.pos[2]);
      m.rotation.set(sd.rot[0], sd.rot[1], sd.rot[2]);
      m.scale.set(sd.w, 1, 1);
      m.renderOrder = 8;
      m.userData.tier = tier;
      facade.add(m);
      tier.mats.push(mat);
      b.facadeMats.push(mat);
    });
    // 转角料：真幕墙都有，也顺手把体量收住
    [[-OX, -OZ], [OX, -OZ], [OX, OZ], [-OX, OZ]].forEach(([x, z]) => {
      const c = new THREE.Mesh(colGeo, colMat);
      c.position.set(x, 0, z);
      c.userData.tier = tier;
      facade.add(c);
    });
    b.facadeTiers.push(tier);
  });

  /* 退台挑檐：裙楼顶面外露的一圈薄板 + 塔楼根部一道深色收边。
     没有这一圈，两段体量会像两个盒子叠着放 */
  const ledge = new THREE.Group();
  // 裙楼屋面外挑：只比裙楼楼板多一点，尺寸不再外扩太多，退台的台阶才干净
  const LW = b.FW * b.podK + 1.1, LD = b.FD * b.podK + 1.1, LT = 0.5, LH = 0.40;
  const ledgeMat = new THREE.MeshStandardMaterial({
    color: 0xdfe6ee, roughness: .55, metalness: .18, envMapIntensity: .4
  });
  const ledgeEdgeMat = new THREE.MeshStandardMaterial({
    color: 0x8c9aab, roughness: .7, metalness: .2, envMapIntensity: .3
  });
  const addRing = (grp, W, D, T, H2, mat, y) => {
    [[0, D / 2 - T / 2, W, T], [0, -D / 2 + T / 2, W, T],
     [-W / 2 + T / 2, 0, T, D - T * 2], [W / 2 - T / 2, 0, T, D - T * 2]]
      .forEach(([x, z, w, d]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, H2, d), mat);
        m.position.set(x, y, z);
        grp.add(m);
      });
  };
  // 裙楼屋面：退台处不能是空的，否则从外观视角能一眼看进 4 层的高度
  const podRoofMat = new THREE.MeshStandardMaterial({
    color: 0x8f99a6, roughness: .88, metalness: .05, envMapIntensity: .2
  });
  const podRoof = new THREE.Mesh(new THREE.BoxGeometry(LW - 0.9, 0.34, LD - 0.9), podRoofMat);
  podRoof.position.y = -0.19;
  ledge.add(podRoof);
  addRing(ledge, LW, LD, LT, LH, ledgeMat, 0);
  addRing(ledge, LW - 0.1, LD - 0.1, LT * 0.7, LH * 0.5, ledgeEdgeMat, -LH * 0.62);
  ledge.visible = false;
  b.group.add(ledge);
  b.ledge = ledge;

  /* 冠部：照片顶部的亮色收头。一条实心带把塔顶压住，
     比让幕墙直接切齐更像真楼的女儿墙与冠板 */
  const crown = new THREE.Group();
  const CW = b.FW * b.towerK + 0.55, CD = b.FD * b.towerK + 0.55;
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xe9edf1, roughness: .62, metalness: .1, envMapIntensity: .35
  });
  addRing(crown, CW, CD, 0.52, 2.1, crownMat, 0);
  const crownCap = new THREE.Mesh(new THREE.BoxGeometry(CW, 0.30, CD), crownMat);
  crownCap.position.y = 1.02;
  crown.add(crownCap);
  crown.visible = false;
  b.group.add(crown);
  b.crown = crown;

  b.group.add(facade);
  b.facade = facade;

  /* ---------- 屋顶：按照片 —— 露天木平台 ----------
     照片实测：木板缝周期 26~27px（平行等距）、木色 #57442B~#A37B4B、均值 #6C5031；
     远边缘轮廓三段高度 → 女儿墙 + 一处出屋面房间（机房）。
     板缝用 canvas 贴图而不是建几何：整片平台几十块板，建 Mesh 是纯浪费。 */
  const roof = new THREE.Group();
  // 屋顶落在塔楼顶面：收进后的尺寸，不是裙楼的尺寸
  const RW = b.FW * b.towerK, RD = b.FD * b.towerK;
  roof.visible = false;
  const topY = 0;    // 相对屋顶组原点，整体高度由 refreshBuildingShell 设定

  const roofMat = new THREE.MeshStandardMaterial({
    color: 0xd6dee9, roughness: .82, metalness: .05, envMapIntensity: .3
  });

  /* 木地板贴图：横向长板 + 深色板缝 + 每块板的色差 */
  const deckTex = (function makeDeck(){
    const c = document.createElement('canvas');
    c.width = 32; c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#6f5334'; g.fillRect(0, 0, 32, 512);
    // 竖向板缝：一层贴图覆盖 4 块板
    const planks = 4, pw = 512 / planks;
    const tons = ['#6f5334', '#7d5f3d', '#614828', '#846443', '#6a4e30', '#775839'];
    for (let i = 0; i < planks; i++){
      g.fillStyle = tons[i % tons.length];
      g.fillRect(i * pw + 1.4, 0, pw - 2.8, 512);
      // 木纹：几道细线
      g.strokeStyle = 'rgba(48,32,16,.28)';
      g.lineWidth = 0.9;
      for (let k = 0; k < 3; k++){
        const x = i * pw + 3 + Math.random() * (pw - 8);
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 1.2, 512); g.stroke();
      }
      // 板缝
      g.fillStyle = 'rgba(40,26,12,.85)';
      g.fillRect(i * pw, 0, 1.4, 512);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  })();

  /* 平台基层（石材），四周外露一圈，当作女儿墙内侧的压顶带 */
  const kerbMat = new THREE.MeshStandardMaterial({
    color: 0x9d8567, roughness: .88, metalness: .03, envMapIntensity: .2
  });
  const baseSlab = new THREE.Mesh(
    new THREE.BoxGeometry(RW + 1.4, 0.26, RD + 1.4), kerbMat);
  baseSlab.position.y = topY + 0.13;
  roof.add(baseSlab);

  /* 木地板面层：比基层内收一圈 */
  const DECK_W = RW - 1.0, DECK_D = RD - 1.0;
  const deckMat = new THREE.MeshStandardMaterial({
    map: deckTex, roughness: .72, metalness: .02, envMapIntensity: .26,
    color: 0xffffff, emissive: 0x241708, emissiveIntensity: .22
  });
  // 板宽：照片里缝距 26px，整幅可见宽度约 400px → 视野内约 15 块。
  // 模型平台宽 DECK_W，视野约占 0.55 → 目标 板宽 ≈ DECK_W*0.55/(15*4) 每贴图 4 块
  const plankW = Math.max(0.55, DECK_W * 0.55 / (15 * 4));
  deckTex.repeat.set(DECK_W / (plankW * 4), 1);
  deckTex.rotation = 0;
  const deck = new THREE.Mesh(
    new THREE.PlaneGeometry(DECK_W, DECK_D), deckMat);
  deck.rotation.x = -Math.PI / 2;
  deck.rotation.z = 0;
  deck.position.y = topY + 0.265;
  deck.receiveShadow = true;
  roof.add(deck);

  /* 女儿墙：白色薄墙（照片远边缘那条亮线就是这个） */
  const PW = RW + 1.4, PD = RD + 1.4, PH2 = 1.05, PT3 = 0.30;
  const parMat = new THREE.MeshStandardMaterial({
    color: 0xe8ebee, roughness: .7, metalness: .04, envMapIntensity: .3
  });
  [[0, PD / 2 - PT3 / 2, PW, PT3], [0, -PD / 2 + PT3 / 2, PW, PT3],
   [-PW / 2 + PT3 / 2, 0, PT3, PD - PT3 * 2],
   [PW / 2 - PT3 / 2, 0, PT3, PD - PT3 * 2]].forEach(([x, z, w, d]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, PH2, d), parMat);
    m.position.set(x, topY + 0.26 + PH2 / 2, z);
    roof.add(m);
  });

  /* 玻璃栏杆：女儿墙上一道通透护栏，屋顶平台常见，也让边缘读起来更轻 */
  const railMat = new THREE.MeshStandardMaterial({
    color: 0xcfe3ee, roughness: .12, metalness: .1, envMapIntensity: .8,
    transparent: true, opacity: .30
  });
  const postMat = new THREE.MeshStandardMaterial({
    color: 0xb9c2cc, roughness: .32, metalness: .7, envMapIntensity: .6
  });
  const RH = 0.62;
  [[0, PD / 2 - 0.16, PW - 0.4, 0.04], [0, -PD / 2 + 0.16, PW - 0.4, 0.04],
   [-PW / 2 + 0.16, 0, 0.04, PD - 0.4],
   [PW / 2 - 0.16, 0, 0.04, PD - 0.4]].forEach(([x, z, w, d]) => {
    const g2 = new THREE.Mesh(new THREE.BoxGeometry(w, RH, d), railMat);
    g2.position.set(x, topY + 0.26 + PH2 + RH / 2, z);
    roof.add(g2);
  });
  // 立柱：沿四边等距
  (function posts(){
    const n = Math.max(4, Math.round(PW / 5));
    const geo = new THREE.BoxGeometry(0.09, RH + 0.1, 0.09);
    const im = new THREE.InstancedMesh(geo, postMat, (n + 1) * 2 + 8);
    const o = new THREE.Object3D();
    let k = 0;
    for (let i = 0; i <= n; i++){
      const x = -PW / 2 + 0.3 + (PW - 0.6) / n * i;
      [PD / 2 - 0.16, -PD / 2 + 0.16].forEach(z => {
        o.position.set(x, topY + 0.26 + PH2 + RH / 2, z);
        o.updateMatrix(); im.setMatrixAt(k++, o.matrix);
      });
    }
    for (let i = 1; i < 5; i++){
      const z = -PD / 2 + 0.3 + (PD - 0.6) / 5 * i;
      [PW / 2 - 0.16, -PW / 2 + 0.16].forEach(x => {
        o.position.set(x, topY + 0.26 + PH2 + RH / 2, z);
        o.updateMatrix(); im.setMatrixAt(k++, o.matrix);
      });
    }
    im.count = k;
    im.instanceMatrix.needsUpdate = true;
    roof.add(im);
  })();

  /* 出屋面房间：照片远边缘轮廓有三段不同高度，这一处凸起对应它 */
  const pentMat = new THREE.MeshStandardMaterial({
    color: 0xdfe4ea, roughness: .78, metalness: .04, envMapIntensity: .28
  });
  const towerFH = b.floors[b.floors.length - 1].h;
  const pentW = RW * 0.26, pentD = RD * 0.24, pentH = towerFH * 0.80;
  const pent = new THREE.Mesh(new THREE.BoxGeometry(pentW, pentH, pentD), pentMat);
  pent.position.set(-RW * 0.22, topY + 0.26 + pentH / 2, -RD * 0.20);
  roof.add(pent);
  // 房间压顶
  const pentCap = new THREE.Mesh(
    new THREE.BoxGeometry(pentW + 0.5, 0.16, pentD + 0.5), parMat);
  pentCap.position.set(pent.position.x, topY + 0.26 + pentH + 0.08, pent.position.z);
  roof.add(pentCap);

  /* 花池 + 灌木 + 木质坐凳：露天平台的生活感靠这三样 */
  const planterMat = new THREE.MeshStandardMaterial({
    color: 0x8d7b5f, roughness: .9, metalness: .02, envMapIntensity: .18
  });
  const soilMat = new THREE.MeshStandardMaterial({
    color: 0x3d4a2c, roughness: .98, metalness: 0, envMapIntensity: .1
  });
  const bushMat = new THREE.MeshStandardMaterial({
    color: 0x4e6b36, roughness: .9, metalness: 0, envMapIntensity: .18,
    emissive: 0x101a08, emissiveIntensity: .4
  });
  const benchMat = new THREE.MeshStandardMaterial({
    color: 0x8a6a44, roughness: .8, metalness: .02, envMapIntensity: .2
  });

  // 两条长花池沿平台两侧铺开
  const PX = RW * 0.62, PZ = 2.2;
  [-1, 1].forEach(sgn => {
    const px = sgn * RW * 0.14, pz = sgn * RD * 0.30;
    const box2 = new THREE.Mesh(new THREE.BoxGeometry(PX, 0.7, PZ), planterMat);
    box2.position.set(px, topY + 0.26 + 0.35, pz);
    roof.add(box2);
    const soil = new THREE.Mesh(new THREE.BoxGeometry(PX - 0.2, 0.06, PZ - 0.2), soilMat);
    soil.position.set(px, topY + 0.26 + 0.70, pz);
    roof.add(soil);
    // 灌木：沿花池密排，个头更大
    const n2 = Math.max(5, Math.round(PX / 3.2));
    const bushGeo = new THREE.SphereGeometry(0.72, 12, 9);
    const im = new THREE.InstancedMesh(bushGeo, bushMat, n2);
    const o2 = new THREE.Object3D();
    for (let i = 0; i < n2; i++){
      o2.position.set(px - PX / 2 + 1.4 + (PX - 2.8) / Math.max(1, n2 - 1) * i,
                      topY + 0.26 + 1.02, pz);
      const sc = 0.8 + ((i * 37) % 10) / 22;
      o2.scale.set(sc * 1.15, sc * 0.92, sc);
      o2.rotation.y = i * 0.7;
      o2.updateMatrix();
      im.setMatrixAt(i, o2.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    roof.add(im);
  });

  // 木坐凳：两张，对着花池
  [[-RW * 0.13, RD * 0.06], [RW * 0.16, -RD * 0.02]].forEach(([x, z]) => {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(9, 0.42, 1.5), benchMat);
    seat.position.set(x, topY + 0.26 + 0.21, z);
    roof.add(seat);
  });

  /* 屋顶设备：两组冷却塔 */
  const towerGeo = new THREE.CylinderGeometry(1.15, 1.15, 1.4, 18);
  const towerMat = new THREE.MeshStandardMaterial({
    color: 0xaab8c9, roughness: .55, metalness: .35, envMapIntensity: .45
  });
  [[RW * 0.24, -RD * 0.24], [RW * 0.24, -RD * 0.06]].forEach(([x, z]) => {
    const t2 = new THREE.Mesh(towerGeo, towerMat);
    t2.position.set(x, topY + 0.26 + 0.7, z);
    roof.add(t2);
  });

  /* 屋顶字标只给主楼（塔楼）建。配楼是四层板楼，屋面进深很小，
     竖一块「中国东方资产」会把整个平台压满，也不符合真楼的挂字逻辑。 */
  if (b.id === 'main'){
    /* ---------- 屋顶标识：徽标 + 「中国东方资产」 ----------
       组成：左 logo3.png 的矢量轮廓 + 右「中国东方资产」，两者同色。
       配色按照片 logo1.jpg 实测：图片是 262×125 的摄影件（Vision OCR 无可读文字），
       亮度直方图在 0.5~0.6 处单峰、非平面填充 → 属「深色底 + 金色字」的牌面。
         · 亮金主色 #c28b34（占比 16.8%，即字面受光部）
         · 深古铜底 #412d18（占比 12.5%，即牌面暗部）
       所以整体走香槟金渐变 + 深古铜底：logo 与字标共用 GOLD_STOPS，
       颜色严格一致（logo 原稿是单色蓝，此处按用户要求统一成金色）。
       做法：canvas 只画金色部分（透明底），背后另放一块有厚度的深古铜背板与立架，
       无光照材质（toneMapped:false）保证不受场景光影响。 */
    const signCanvas = (function makeSign(){
      const c = document.createElement('canvas');
      c.width = 2048; c.height = 340;
      const g = c.getContext('2d');
      g.clearRect(0, 0, 2048, 340);

      // 香槟金：与照片 logo1.jpg 的亮金 #c28b34 同族，中间调压在这一档
      const GOLD_STOPS = [[0,'#f4d894'],[.28,'#e3b45c'],[.56,'#c8842a'],[.80,'#a16518'],[1,'#7f4f10']];

      // 金色渐变：上下各有亮暗，字才有金属厚度而不是一片黄。
      // 字标与 logo 共用同一组色标，两者的颜色才严格一致
      const goldOf = (y0, y1, stops) => {
        const gr = g.createLinearGradient(0, y0, 0, y1);
        (stops || GOLD_STOPS).forEach(([t, c2]) => gr.addColorStop(t, c2));
        return gr;
      };

      const R = 104;                       // 徽标半高（px）：logo 高度取 2R 略多
      const CH = '中国东方资产'.split('');
      const fs = 196, gap = 14;
      const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      g.font = `bold ${fs}px ${FONT}`;
      const widths = CH.map(ch => g.measureText(ch).width);
      const textW = widths.reduce((a, v) => a + v, 0) + gap * (CH.length - 1);
      const logoW = R * 2.02 * (LOGO_BOX.w / LOGO_BOX.h);
      const gap2 = 54;                       // logo 与字标之间的呼吸
      const totalW = logoW + gap2 + textW;
      const x0 = (2048 - totalW) / 2;
      const logoCx = x0 + logoW / 2, logoCy = 150;

      /* 徽标：用户上传的 logo3.png，矢量化后用同款金色填充。
         原图是纯色 #004f99 单色稿，这里不保留原蓝色 —— 按要求「logo 颜色与文字一样」，
         统一走香槟金竖向渐变，与字标同一组色标，远看是一枚金色标记。 */
      (function logo(){
        const LH = R * 2.02;                       // 徽标高≈字号（略高一点，压住字身）
        const LW = LH * (LOGO_BOX.w / LOGO_BOX.h);
        const lx = logoCx - LW / 2, ly = logoCy - LH / 2;
        const sc = LH / LOGO_BOX.h;
        g.save();
        g.translate(lx, ly);
        g.scale(sc, sc);
        g.fillStyle = goldOf(0, LOGO_BOX.h, GOLD_STOPS);
        const p2 = new Path2D(LOGO_PATH);
        g.fill(p2, 'evenodd');
        g.restore();
      })();

      /* 字标：香槟金渐变 + 深古铜描边（描边不是为了装饰，
         浅金压在深底若无描边，缩小后笔画会与底色糊成一片） */
      let x = x0 + logoW + gap2;
      g.textAlign = 'left'; g.textBaseline = 'middle';
      CH.forEach((ch, i) => {
        g.font = `bold ${fs}px ${FONT}`;
        g.lineJoin = 'round';
        g.lineWidth = 7;
        g.strokeStyle = 'rgba(72,48,16,.75)';
        g.strokeText(ch, x, 150);
        g.fillStyle = goldOf(150 - fs * 0.44, 150 + fs * 0.44);
        g.fillText(ch, x, 150);
        x += widths[i] + gap;
      });

      /* 英文副标：同色系、低一档亮度，只作衬托 */
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(198,152,82,.92)';
      g.font = '600 42px "Helvetica Neue",Arial,sans-serif';
      const EN = 'CHINA ORIENT ASSET MANAGEMENT';
      const lw = [...EN].reduce((a, ch) => a + g.measureText(ch).width + 9, 0) - 9;
      let lx = 1024 - lw / 2;
      [...EN].forEach(ch => {
        const w2 = g.measureText(ch).width;
        g.fillText(ch, lx + w2 / 2, 302);
        lx += w2 + 9;
      });

      // 牌面金色细边框：把整块牌子收住，也让「金字 + 暗底」更像成品
      g.strokeStyle = 'rgba(206,164,96,.55)';
      g.lineWidth = 4;
      g.strokeRect(3, 3, 2048 - 6, 340 - 6);

      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    })();

    const sign = new THREE.Group();
    // 字标宽度取塔楼面的 46%（不超过 38）：真楼的屋顶字标是「占一段」，不是铺满整条女儿墙
    // 字标宽度取塔楼立面的 0.56（上限 44）：照片里的屋顶招牌是「占半个立面」的量级，
    // 太小在整栋视图里只剩一条浅带，认不出字
    const SIGN_W = Math.min(RW * 0.56, 44), SIGN_H = SIGN_W * (340 / 2048);
    const signMat = new THREE.MeshBasicMaterial({
      map: signCanvas, transparent: true, alphaTest: .02,
      depthWrite: false, toneMapped: false, side: THREE.FrontSide
    });
    const signPlane = new THREE.Mesh(new THREE.PlaneGeometry(SIGN_W, SIGN_H), signMat);
    signPlane.renderOrder = 6;
    sign.add(signPlane);

    // 背板 + 立架：深古铜（照片牌面暗部 #412d18 → 这里压深一档，才托得住金字）
    const backMat = new THREE.MeshStandardMaterial({
      color: 0x241a12, roughness: .58, metalness: .45, envMapIntensity: .35
    });
    const signBack = new THREE.Mesh(
      new THREE.BoxGeometry(SIGN_W * 0.98, SIGN_H * 0.96, 0.12), backMat);
    signBack.position.z = -0.22;
    sign.add(signBack);
    const legGeo = new THREE.BoxGeometry(0.26, 1, 0.26);
    legGeo.translate(0, 0.5, 0);
    [-SIGN_W * 0.34, 0, SIGN_W * 0.34].forEach(lx2 => {
      const leg = new THREE.Mesh(legGeo, backMat);
      leg.position.set(lx2, -SIGN_H / 2 - 0.55, -0.16);
      leg.scale.y = SIGN_H / 2 + 0.7;
      sign.add(leg);
    });

    // 主牌：朝南（正对主视角），立在女儿墙上沿之上
    sign.position.set(0, topY + 0.26 + 1.05 + SIGN_H / 2 + 0.55, RD / 2 - 0.35);
    roof.add(sign);
    b.roofSign = sign;

    /* 侧立面一块小一点的同样的牌子：从东侧看过去也有标识 */
    const signE = sign.clone();
    signE.scale.setScalar(0.72);
    signE.rotation.y = Math.PI / 2;
    signE.position.set(RW / 2 - 1.3, topY + 0.26 + 1.05 + SIGN_H * 0.36 + 0.55, -RD * 0.06);
    roof.add(signE);
  }

  b.group.add(roof);
  b.roof = roof;

  /* ---------- 首层基座（石材裙房）＋ 入口雨棚 ＋ 广场 ---------- */
  const base = new THREE.Group();
  base.visible = false;

  const stoneMat = new THREE.MeshStandardMaterial({
    color: 0x9aa6b4, roughness: .78, metalness: .06, envMapIntensity: .28
  });

  // 裙房：比主体外扩一圈，高约一层半，真楼底部都有更厚重的基座
  const PFH = floorH(0, b);                 // 裙楼层高：基座、雨棚都按它，别用原始 FH
  // 基座基准从「原始楼宽」换成「裙楼宽度」：外扩量仍是每边 1.0（总宽 +2.0），
  // 但基准跟着裙楼收，否则裙楼缩了、基座还按 104 算，会凭空多出两圈宽檐
  const PBW = b.FW * b.podK, PBD = b.FD * b.podK;
  const BX = PBW + 2.0, BZ = PBD + 2.0, BH = PFH * 1.05;   // 基座比一层略高，才有厚重的「座」
  const pod = new THREE.Mesh(
    new THREE.BoxGeometry(BX, BH, BZ), stoneMat);
  pod.position.y = BH / 2 - 0.1;
  base.add(pod);

  // 石材分缝：竖向浅槽，避免裙房是一整块灰。
  // 用实例化：每个立面三十多条缝，逐个建 Mesh 会白吃几十个 draw call。
  const grooveMat = new THREE.MeshStandardMaterial({
    color: 0x7d8896, roughness: .85, metalness: .04
  });
  const gCount = Math.round(BX / 3.2);
  const gIm = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.22, BH * 0.92, 0.22), grooveMat, (gCount + 1) * 2);
  const go = new THREE.Object3D();
  let gi = 0;
  for (let i = 0; i <= gCount; i++){
    const gx = -BX / 2 + (BX / gCount) * i;
    [BZ / 2 + 0.02, -BZ / 2 - 0.02].forEach(z => {
      go.position.set(gx, BH / 2 - 0.1, z);
      go.updateMatrix();
      gIm.setMatrixAt(gi++, go.matrix);
    });
  }
  gIm.instanceMatrix.needsUpdate = true;
  base.add(gIm);

  // 入口雨棚（南立面正中）
  const canW = Math.min(PBW * 0.34, 26), canD = 4.2;
  const canopy = new THREE.Mesh(
    new THREE.BoxGeometry(canW, 0.34, canD),
    new THREE.MeshStandardMaterial({ color:0xdfe6ee, roughness:.4, metalness:.35, envMapIntensity:.5 })
  );
  canopy.position.set(0, PFH * 0.88, BZ / 2 + canD / 2 - 0.4);
  base.add(canopy);
  // 雨棚下两颗细柱
  const postGeo = new THREE.CylinderGeometry(0.16, 0.16, PFH * 0.88, 10);
  [-canW / 2 + 1.2, canW / 2 - 1.2].forEach(x => {
    const post = new THREE.Mesh(postGeo, stoneMat);
    post.position.set(x, PFH * 0.44, BZ / 2 + canD - 0.8);
    base.add(post);
  });

  // 广场：一块大而薄的地坪，只作落地参照
  // 照片里建筑底部被绿植遮挡 → 地坪取橄榄绿，比灰地更接近实景
  const plaza = new THREE.Mesh(
    new THREE.PlaneGeometry(PBW + 10, PBD + 10),
    new THREE.MeshStandardMaterial({
      color: 0x8a9068, roughness: .96, metalness: 0, envMapIntensity: .12
    })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.y = -1.0;
  base.add(plaza);

  b.group.add(base);
  b.base = base;
});

const selLines = new THREE.Group();
world.add(selLines);
const selMat = new THREE.LineBasicMaterial({ color:0x1f57cc, transparent:true, opacity:.95 });

/* =========================================================
   状态
   ========================================================= */
const state = {
  mode:'one',
  bi:0,
  fi:0,
  selected:null,
  dimCat:null,
  spread:0,
  target:0,
  facade:'solid',   // solid=外观（真实幕墙）, xray=剖切（看清楼层）
  gap:GAP_SOLID,    // 当前层间空隙，随 facade 插值
  liftT:0,
  hoverFi:-1,      // 整栋模式下鼠标悬停的楼层：浮起并高亮
  hoverT:0
};

const curB = () => BUILDINGS[state.bi];
const curF = () => curB().floors[state.fi];

/* 外壳（幕墙 + 屋顶）随楼层总高刷新 */
function refreshBuildingShell(b){
  // 逐段累加：塔楼层高被抬高，各段的 pitch / 起始高度 / 总高都不再是「层数 × 同一定值」
  let y = 0;
  b.facadeTiers.forEach(t => {
    t.pitch = b.floors[t.f0].h + state.gap;
    t.base = y;
    t.height = t.nF * t.pitch;
    y += t.height;
  });
  if (b.facade){
    b.facade.children.forEach(c => {
      const t = c.userData.tier;
      if (!t) return;
      c.scale.y = t.height;
      c.position.y = t.base;
    });
  }
  if (b.facadeTiers) b.facadeTiers.forEach(t =>
    t.mats.forEach(mt => { mt.uniforms.uPitch.value = t.pitch; }));
  if (b.ledge){
    b.ledge.position.y = floorY(Math.min(PODIUM_FLOORS, b.floors.length), 1, b) - 0.03;
    b.ledge.visible = !!(b.facade && b.facade.visible);
  }
  if (b.crown){
    b.crown.position.y = towerH(b) - 1.05;
    b.crown.visible = !!(b.facade && b.facade.visible);
  }
  if (b.roof) b.roof.position.y = towerH(b) + 0.02;
}

/* 层位置：累加每层真实层高（塔楼更高），不能再用 i × 定值 */
function floorY(i, spread, b){
  b = b || curB();
  let y = 0;
  const g = state.gap;
  for (let k = 0; k < i && k < b.floors.length; k++) y += b.floors[k].h + g;
  return y * spread;
}
function towerH(b){
  let y = 0;
  const g = state.gap;
  b.floors.forEach(f => { y += f.h + g; });
  return Math.max(FH, y - g);
}

/* ---------- 可见性 ---------- */
function applyVisibility(){
  const b = curB();
  const all = state.mode === 'all';
  const solid = all && state.facade === 'solid';

  b.floors.forEach((f, i) => {
    const isSel = i === state.fi;
    const vis = all || isSel;
    f.group.visible = vis;
    const m = f.group.userData.mats;
    const dim = all && !isSel;

    // 外观模式：室内压暗但不隐藏 —— 透过玻璃隐约看到楼层，才像有人用的真楼
    const dimK = solid ? 0.42 : 0.84;
    m.slab.color.copy(SLAB_BASE).lerp(SLAB_DARK, dim ? 0.55 : (solid ? 0.30 : 0));
    if (f.group.userData.plinthGroup) f.group.userData.plinthGroup.visible = all ? isSel && !solid : true;
    m.edge.opacity = isSel ? 0.92 : (solid ? 0.18 : 0.4);
    m.walls.visible = all ? isSel && !solid : true;
    m.caps.visible = all ? isSel && !solid : true;
    if (f.group.userData.mullions) f.group.userData.mullions.visible = !all;

    if (f.group.userData.glassFrame) f.group.userData.glassFrame.visible = all && !solid;
    if (f.group.userData.tag) f.group.userData.tag.visible = false;
    if (f.group.userData.strip) f.group.userData.strip.visible = all && !solid && !isSel;

    // 家具只在「看清这一层」时出现：整栋（外观/剖切）一律隐藏，
    // 一来那个尺度下家具只有几像素，二来省掉每层几百个实例的绘制
    if (vis && !all && !solid){
      buildFurniture(f).visible = true;
    } else if (f.furn){
      f.furn.visible = false;
    }

    const hK = 0.945 + 0.055 * (i / Math.max(1, b.floors.length - 1));
    f.rooms.forEach(r => {
      r.mesh.visible = true;
      tintRoom(r, dim ? dimK * hK : (solid ? 0.86 : 1));
      if (r.ao) r.ao.visible = !all || (isSel && !solid);
    });
  });

  // 其他楼栋整体隐藏；外壳只在当前楼栋的外观模式出现
  BUILDINGS.forEach((bb, i) => {
    bb.group.visible = i === state.bi;
    if (bb.cornerEdge) bb.cornerEdge.visible = all && !solid && i === state.bi;
    if (bb.facade) bb.facade.visible = solid && i === state.bi;
    if (bb.roof) bb.roof.visible = solid && i === state.bi;
    if (bb.base) bb.base.visible = solid && i === state.bi;
    if (bb.ledge) bb.ledge.visible = solid && i === state.bi;
    if (bb.crown) bb.crown.visible = solid && i === state.bi;
  });

  if (b.facadeMats) b.facadeMats.forEach(mt => {
    mt.uniforms.uInterior.value = solid ? 1.0 : 0.0;
  });

  // 外壳高度必须每次模式切换都同步：只看 gap 是否变化会漏掉
  // 「首次进入整栋时 gap 已经是目标值」的情况，幕墙会停在 scale.y=1 的一条细片上
  BUILDINGS.forEach(bb => refreshBuildingShell(bb));


  // 外观模式换成照片的黄昏天空；幕墙的天空反射由着色器解析计算，不依赖穹顶
  document.body.classList.toggle('sky-real', solid);
  if (solid){
    key.color.setHex(0xfff2dc);
    key.intensity = 3.4;
    key.position.set(92, 46, -84);
    fill.intensity = 0.20;
    rim.intensity = 0.30;
  } else {
    key.color.setHex(0xfff6ea);
    key.intensity = 3.1;
    key.position.set(34, 62, 46);
    fill.intensity = 0.42;
    rim.intensity = 0.62;
  }

  // 整栋概览关掉环境贴图：全屏面积下这次采样很贵，而视觉上分辨不出
  scene.environment = all ? null : ENV_TEX;
}

/* =========================================================
   标签
   ========================================================= */
const labelsEl = document.getElementById('labels');
let labelItems = [];
function buildLabels(){
  labelsEl.innerHTML = '';
  labelItems = [];
  if (state.mode === 'all') return;
  const f = curF();
  f.rooms.forEach(r => {
    if (state.dimCat && r.cat !== state.dimCat && r !== state.selected) return;
    const el = document.createElement('div');
    el.className = 'lbl' + (r.w < 3.2 ? ' sm' : '');
    const txt = (r.no ? r.no + ' ' : '') + r.label;
    el.textContent = txt.length > 12 ? txt.slice(0, 11) + '…' : txt;
    labelsEl.appendChild(el);
    labelItems.push({ el, room:r });
  });
}
const v3 = new THREE.Vector3();
const vL = new THREE.Vector3();
const vR = new THREE.Vector3();
function updateLabels(){
  if (!labelItems.length) return;
  const w = window.innerWidth, h = window.innerHeight;
  const yBase = state.mode === 'all' ? floorY(state.fi, state.spread) : 0;
  const yL = yBase + WALL_H + 0.45;   // 标签贴在房间墙上，与层高无关
  labelItems.forEach(it => {
    const r = it.room;
    v3.set(r.cx, yL, r.cz).project(camera);
    if (v3.z > 1){ it.el.style.display = 'none'; return; }
    // 投影出房间在屏幕上的宽度，太小则隐藏（放大后自动出现）
    vL.set(r.x, yL, r.cz).project(camera);
    vR.set(r.x + r.w, yL, r.cz).project(camera);
    const pxW = Math.abs(vR.x - vL.x) * 0.5 * w;
    if (r !== state.selected && pxW < 21){ it.el.style.display = 'none'; return; }
    it.el.style.display = '';
    it.el.classList.toggle('sm', pxW < 40);
    it.el.style.transform = `translate(-50%,-50%) translate(${(v3.x*.5+.5)*w}px,${(-v3.y*.5+.5)*h}px)`;
  });
}

/* =========================================================
   取景
   ========================================================= */
const probe = new THREE.PerspectiveCamera(40, 1, 0.1, 3000);
function visibleBox(pad){
  const W = window.innerWidth, H = window.innerHeight;
  let l = pad;
  if (W > 900){
    const sr = document.getElementById('side').getBoundingClientRect().right;
    l = Math.min(sr + 12, W * 0.42) + pad;
  }
  let r = W - pad;
  const dEl = document.getElementById('detail');
  if (W > 900 && dEl.classList.contains('show')) r = W - pad - dEl.getBoundingClientRect().width - 26;
  return { l, r, t:pad, b:H - pad, W, H };
}
function bboxPx(cam, corners){
  const W = window.innerWidth, H = window.innerHeight;
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const c of corners){
    const v = c.clone().project(cam);
    const px = (v.x * .5 + .5) * W, py = (-v.y * .5 + .5) * H;
    minx = Math.min(minx, px); maxx = Math.max(maxx, px);
    miny = Math.min(miny, py); maxy = Math.max(maxy, py);
  }
  return { minx, maxx, miny, maxy, cx:(minx + maxx) / 2, cy:(miny + maxy) / 2 };
}
function solveView(target, dir, corners, pad){
  const vb = visibleBox(pad);
  let ox = -((vb.l + vb.r) / 2 - vb.W / 2), oy = 0, dist = 40;

  // 二分求「刚好装下」的距离（在当前视锥偏移下）
  const fitDist = () => {
    probe.fov = camera.fov;
    probe.aspect = vb.W / vb.H;
    probe.setViewOffset(vb.W, vb.H, ox, oy, vb.W, vb.H);
    probe.updateProjectionMatrix();
    let lo = 4, hi = 3000;
    for (let i = 0; i < 52; i++){
      const mid = (lo + hi) / 2;
      probe.position.copy(target).addScaledVector(dir, mid);
      probe.lookAt(target);
      probe.updateMatrixWorld(true);
      const b = bboxPx(probe, corners);
      if (b.minx >= vb.l && b.maxx <= vb.r && b.miny >= vb.t && b.maxy <= vb.b) hi = mid; else lo = mid;
    }
    return hi;
  };

  for (let pass = 0; pass < 8; pass++){
    dist = fitDist();
    probe.position.copy(target).addScaledVector(dir, dist);
    probe.lookAt(target);
    probe.updateMatrixWorld(true);
    const b = bboxPx(probe, corners);
    const dx = b.cx - (vb.l + vb.r) / 2, dy = b.cy - (vb.t + vb.b) / 2;
    if (Math.abs(dx) < 1.0 && Math.abs(dy) < 1.0) break;
    ox += dx; oy += dy;
  }

  // 保险：溢出时把距离放大。放大后内容会向「整幅画面中心」收缩，
  // 而可见区中心被视锥偏移推到了别处 → 必须重新居中，
  // 否则内容整体偏到一侧（屋顶视图曾因此被面板压住半幅）
  for (let guard = 0; guard < 3; guard++){
    probe.position.copy(target).addScaledVector(dir, dist);
    probe.lookAt(target);
    probe.updateMatrixWorld(true);
    const b = bboxPx(probe, corners);
    const overW = Math.max(
      (vb.l - b.minx) / (vb.r - vb.l),
      (b.maxx - vb.r) / (vb.r - vb.l),
      (vb.t - b.miny) / (vb.b - vb.t),
      (b.maxy - vb.b) / (vb.b - vb.t)
    );
    if (overW <= 0.001) break;
    dist *= 1 + overW * 1.05;

    // 放大后重新居中，再进入下一轮判断
    for (let k = 0; k < 4; k++){
      probe.position.copy(target).addScaledVector(dir, dist);
      probe.lookAt(target);
      probe.updateMatrixWorld(true);
      const b2 = bboxPx(probe, corners);
      const dx2 = b2.cx - (vb.l + vb.r) / 2, dy2 = b2.cy - (vb.t + vb.b) / 2;
      if (Math.abs(dx2) < 1.0 && Math.abs(dy2) < 1.0) break;
      ox += dx2; oy += dy2;
      probe.setViewOffset(vb.W, vb.H, ox, oy, vb.W, vb.H);
      probe.updateProjectionMatrix();
    }
  }
  return { dist, ox, oy };
}
function applyOffsets(ox, oy){
  const W = window.innerWidth, H = window.innerHeight;
  if (Math.abs(ox) > .5 || Math.abs(oy) > .5) camera.setViewOffset(W, H, ox, oy, W, H);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}

const DIR_3D = new THREE.Vector3(0.64, 0.54, 0.6).normalize();
const DIR_PLAN = new THREE.Vector3(0, 1, 0.2).normalize();
const DIR_TOWER = new THREE.Vector3(0.56, 0.34, 0.76).normalize();   // 剖切专用：低视角突出立面
// 外观专用：更低的机位、更贴近照片的仰视角度（照片是地面仰拍）
// 抬高到 0.30：照片是地面仰拍看不到顶，但用户要看屋顶平台，得给一点俯角
const DIR_REAL = new THREE.Vector3(0.72, 0.30, 0.62).normalize();
const desired = { target:new THREE.Vector3(), dist:50, on:false };

function frame(){
  const b = curB();
  let corners, target, dir;
  if (state.mode === 'all'){
    dir = state.facade === 'solid' ? DIR_REAL : DIR_TOWER;
    const H = towerH(b);
    target = new THREE.Vector3(0, H * 0.5, 0);
    // 角点要含裙房外扩、雨棚与屋顶字标，否则取景会把边缘和招牌切掉
    // 角点按「基座外沿」取：裙楼缩窄后仍按 b.FW 留边，画面两侧会白出一大块
    const TX = b.FW * b.podK / 2 + 2.0, TZ = b.FD * b.podK / 2 + 3.6;
    corners = [];
    // 上限要含悬停浮起量（1.5）+ 屋顶招牌。只有主楼有招牌；
    // 配楼若也按 11.5 留余量，四层板楼会被压成画面下方一条，上面全是天空
    const upPad = b.id === 'main' ? 11.5 : 2.6;
    for (const x of [-TX, TX]) for (const z of [-TZ, TZ])
      for (const y of [-1.2, H + upPad]) corners.push(new THREE.Vector3(x, y, z));
  } else {
    dir = state.mode === 'plan' ? DIR_PLAN : DIR_3D;
    target = new THREE.Vector3(0, FH * 0.3, 0);
    // 单层模式按「本层」尺寸取景：5 层以上收进以后，仍用裙楼尺寸会把楼层挤成一小块
    const cf = b.floors[state.fi] || b.floors[0];
    const OX = cf.FW / 2 + 1.0, OZ = cf.FD / 2 + 1.0;
    corners = [];
    for (const x of [-OX, OX]) for (const y of [-0.9, WALL_H]) for (const z of [-OZ, OZ])
      corners.push(new THREE.Vector3(x, y, z));
  }
  const sol = solveView(target, dir, corners, state.mode === 'plan' ? 44 : 46);
  applyOffsets(sol.ox, sol.oy);
  desired.target.copy(target);
  desired.dist = sol.dist;
  desired.on = true;
}

BUILDINGS.forEach((b, i) => {

const floorListEl = document.getElementById('floorList');
function buildFloorList(){
  floorListEl.innerHTML = '';
  const b = curB();
  b.floors.slice().reverse().forEach((f, k) => {
    const i = b.floors.length - 1 - k;
    const btn = document.createElement('button');
    btn.className = 'fitem';
    btn.dataset.fi = i;
    const SKIP = { stair:1, lift:1, wc:1 };
    const top = f.rooms.filter(r => !SKIP[r.cat])
      .slice().sort((a, c) => c.frac - a.frac)
      .map(r => r.label).filter(Boolean);
    const uniq = [...new Set(top)].filter(x => x && x !== '未标注');
    const vacN = f.rooms.filter(r => r.occ !== 'inuse').length;

    // mini 构成条：把本层房间按 x 顺序压成一条色带，一行就是该层的剖面
    const sorted = f.rooms.slice().sort((a, c) => a.nx - c.nx);
    const span = Math.max(...sorted.map(r => r.nx + r.nw), 1);
    const mini = sorted.map(r => {
      const pct = Math.max((r.nw / span) * 100, 0.6);
      const col = catInfo(r.cat).c.toString(16).padStart(6, '0');
      return `<i style="width:${pct.toFixed(2)}%;background:#${col}"></i>`;
    }).join('');

    btn.innerHTML = `<span class="row1"><span class="tag">${f.tag}</span><span class="nm">${
      uniq.slice(0, 2).join(' / ') || f.short
    }</span>${vacN ? `<span class="vnum" title="空置 / 待腾退">${vacN}</span>` : ''}<span class="ct">${f.rooms.length}</span></span><span class="mini">${mini}</span>`;
    btn.onclick = () => gotoFloor(i);
    floorListEl.appendChild(btn);
  });
}
function syncList(){
  floorListEl.querySelectorAll('.fitem').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.fi) === state.fi);
  });
  const on = floorListEl.querySelector('.fitem.on');
  if (on) on.scrollIntoView({ block:'nearest' });
  bldgTabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.bi) === state.bi));
}

/* 当前面板按需重建（切层、切楼栋、改选中后调用） */
function refreshPane(){

  else if (curPane === 'vacant') buildVacantPane();
  else if (curPane === 'mnt') buildMntPane();
  // 角标不受面板切换影响，任何面板下都要是最新值（切楼栋后尤其容易残留旧数）

const legendEl = document.getElementById('legend');
function buildLegend(){
  legendEl.innerHTML = '';
  const b = curB();
  const cnt = {};
  b.floors.forEach(f => f.rooms.forEach(r => cnt[r.cat] = (cnt[r.cat] || 0) + 1));
  Object.keys(CAT).filter(k => cnt[k]).forEach(k => {
    const d = document.createElement('div');
    d.className = 'lg' + (state.dimCat && state.dimCat !== k ? ' off' : '');
    d.dataset.cat = k;
    d.innerHTML = `<i style="background:#${CAT[k].c.toString(16).padStart(6, '0')}"></i>${CAT[k].label}`;
    d.onclick = () => {
      state.dimCat = state.dimCat === k ? null : k;
      // 当前层没有该类房间时，自动跳到第一个含该类的楼层
      if (state.dimCat && !curF().rooms.some(r => r.cat === k)){
        const target = b.floors.findIndex(f => f.rooms.some(r => r.cat === k));
        if (target >= 0){
          state.fi = target;
          clearSelection(true);
          applyVisibility();
          buildLabels();
          frame();
        }
      }
      b.floors.forEach(f => f.rooms.forEach(r => {
        const on = !state.dimCat || r.cat === state.dimCat || r === state.selected;
        tintRoom(r, on ? 1 : 0.05);
        r.mesh.userData.pickable = on;
      }));
      buildLegend();
      buildLabels();
    };
    legendEl.appendChild(d);
  });

  // 家具说明：房间里的桌椅/器材只在单层视图出现，写一句免得以为是漏做
  const note = document.createElement('div');
  note.className = 'lg-note';
  note.textContent = '每间房已按功能摆好家具：个人办公室只留一套办公桌椅，会议室长桌、健身房器材、档案架、机柜等各按其用，仅在单层与平面视图显示。';
  legendEl.appendChild(note);
}

function buildStats(){
  const b = curB();
  const all = b.floors.flatMap(f => f.rooms);
  const cnt = {};
  all.forEach(r => cnt[r.cat] = (cnt[r.cat] || 0) + 1);
  const vacN = all.filter(r => r.occ !== 'inuse').length;
  const officeAll = all.filter(r => !NON_OCCUPIABLE[r.cat]).length;
  const rate = officeAll ? (vacN / officeAll * 100).toFixed(0) : '0';
  const mntN = all.filter(r => canMaintain(r) && mntState(r) !== 'none').length;
  // 面积汇总：只统计有依据的（实测 + 折算），未登记的不计入，也不假装有数
  let sumArea = 0, nReal = 0, nEst = 0;
  all.forEach(r => {
    const a = areaOf(r);
    if (!a) return;
    sumArea += a.v;
    if (a.est) nEst++; else nReal++;
  });
  const areaTxt = sumArea >= 10000
    ? (sumArea / 10000).toFixed(2) + ' 万'
    : Math.round(sumArea).toLocaleString('zh-CN');
  updateVacBadge();
  updateMntBadge();
  document.getElementById('stats').innerHTML = `
    <div class="st"><b>${b.floors.length}</b><span>${b.name}楼层</span></div>
    <div class="st"><b>${all.length}</b><span>空间单元</span></div>
    <div class="st"><b style="color:#1f7d52">${vacN}</b><span>空置 / 待腾退</span></div>
    <div class="st"><b style="color:${mntN ? '#b8432c' : 'inherit'}">${mntN}</b><span>维护中</span></div>
    <div class="st" style="grid-column:1/-1;border-top:1px solid rgba(200,214,232,.55);padding-top:7px">
      <b>${areaTxt}<span style="font-size:10px;font-weight:400;color:var(--ink3)"> ㎡</span></b>
      <span>已登记面积${nEst ? `（含 ${nEst} 间折算）` : ''} · 覆盖 ${nReal + nEst}/${all.length}</span>
    </div>`;
  // 托盘收起时的那行摘要：类别数 / 空间 / 空置 / 维护 / 面积
  const traySum = document.getElementById('traySum');
  if (traySum){
    traySum.textContent = `${Object.keys(cnt).length} 类 · ${all.length} 空间 · 空 ${vacN} · 修 ${mntN} · ${areaTxt}㎡`;
  }
  const total = BUILDINGS.reduce((a, x) => a + x.floors.reduce((c, f) => c + f.rooms.length, 0), 0);
  document.getElementById('brandSub').textContent = BUILDINGS.length > 1
    ? BUILDINGS.map(x => `${x.name} ${x.floors.length}F`).join(' + ') + ` · 共 ${total} 个空间`
    : `${b.name} · ${b.floors.length} 层 · ${all.length} 个空间`;
  document.getElementById('tagName').textContent = b.name;
  document.getElementById('tagSub').textContent = `${b.floors.length} 层 · ${all.length} 个空间`;
  document.getElementById('logo').innerHTML = b.name.replace(/^(.{2}).*$/, '$1<br>') || '楼层';
  // 地面柔影只做「落地」暗示，别做成一整片地坪：
  // 太宽的话低视角时它会撑出画面下缘，把取景顶到边界
  groundMesh.scale.set(b.FW * b.podK + 16, b.FD * b.podK + 14, 1);
  groundMesh.position.y = -1.05;
}

let curPane = 'floors';
function setPane(name){
  curPane = name;
  document.querySelectorAll('#paneTabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.pane === name));
  const map = { floors:'paneFloors', rooms:'paneRooms', vacant:'paneVacant', mnt:'paneMnt' };
  Object.entries(map).forEach(([k, id]) => {
    document.getElementById(id).classList.toggle('on', k === name);
  });
  if (name === 'rooms') buildRoomPane();
  if (name === 'vacant') buildVacantPane();
  if (name === 'mnt') buildMntPane();
}
document.getElementById('paneTabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setPane(b.dataset.pane);
});

function noKey(r){
  const m = String(r.no || '').match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 9999;
}
/* 房号自然序；无房号的按名称排在后面 */
function byNo(a, c){
  const na = noKey(a), nc = noKey(c);
  if (na !== nc) return na - nc;
  return String(a.label).localeCompare(String(c.label), 'zh');
}
function occLabel(r){
  const o = OCC[r.occ];
  if (r.occ === 'inuse') return '';
  return `<span class="bdg ${r.occ}">${o.label}</span>`;
}

/* --- 本层房间清单 --- */
function buildRoomPane(){
  const f = curF();
  const head = document.getElementById('roomHead');
  const list = document.getElementById('roomList');
  const rooms = f.rooms.slice().sort(byNo);
  const vacantN = rooms.filter(r => r.occ !== 'inuse').length;

  const mntN = rooms.filter(r => canMaintain(r) && mntState(r) !== 'none').length;
  head.innerHTML = `<b>${f.tag}</b> ${rooms.length} 间`
    + (vacantN ? `<span class="badge-inline">${vacantN} 处空置</span>` : '')
    + (mntN ? `<span class="badge-inline" style="color:#b8432c;background:rgba(214,84,64,.12)">${mntN} 处维护</span>` : '')
    + `<span class="sp">按房号排序</span>`;

  renderAreaBar();

  list.innerHTML = rooms.map(r => {
    const cat = catInfo(r.cat);
    const sel = state.selected === r ? ' on' : '';
    const ar = areaOf(r);
    const st = canMaintain(r) ? mntState(r) : 'none';
    const mntCls = st !== 'none' ? ' mnt' : '';
    return `<div class="rm${sel}${mntCls}" data-bi="${r.bi}" data-fi="${r.fi}" data-ri="${r.ri}">
      <span class="sw" style="background:#${cat.c.toString(16).padStart(6, '0')}"></span>
      <span class="no">${r.no || '—'}</span>
      <span class="nm">${escHtml(r.label)}${
        r.person && r.person !== r.label ? `<em class="sub"> · ${escHtml(r.person)}</em>` : ''
      }</span>
      ${hasRoomOvr(r) ? '<span class="edot" title="资料已修改"></span>' : ''}
      ${st !== 'none' ? `<span class="wrench" title="${MNT_STATUS[st].label}">${activeRecs(r).length}</span>` : ''}
      ${occLabel(r)}
      <span class="ar${ar ? (ar.est ? ' est' : '') : ' none'}">${ar ? fmtArea(ar) : '—'}</span>
    </div>`;
  }).join('');

  list.querySelectorAll('.rm').forEach(el => {
    const getRoom = () => FLOORS_AT(+el.dataset.bi, +el.dataset.fi).rooms[+el.dataset.ri];
    el.onclick = () => {
      const r = getRoom();
      if (!r) return;
      state.fi = r.fi;
      syncList();
      applyVisibility();
      buildLabels();
      selectRoom(r, true);
      markRoomRow(r);
    };
    // 双击直接进编辑：改人员时少一次点击
    el.ondblclick = () => {
      const r = getRoom();
      if (!r) return;
      el.click();
      editingRoom = r;
      renderEditForm(r);
      const form = document.getElementById('dEditForm');
      if (form) form.scrollIntoView({ block: 'nearest' });
    };
    el.title = '单击查看 · 双击编辑资料';
  });
}

/* 本层面积合计：设一次，本层没填面积的房间就按占比折算 */
function renderAreaBar(){
  const pane = document.getElementById('paneRooms');
  if (!pane) return;
  let bar = document.getElementById('areaBar');
  if (!bar){
    bar = document.createElement('div');
    bar.id = 'areaBar';
    bar.className = 'areabar';
    pane.insertBefore(bar, pane.querySelector('.rmhead').nextSibling);
  }
  const b = curB(), f = curF();
  const total = floorTotal(b, f);
  const st = floorAreaStat(b, f);
  const known = st.real + st.est;
  const cov = Math.round(known / Math.max(1, f.rooms.length) * 100);
  bar.innerHTML = `面积合计
    <input id="floorAreaInput" type="number" step="1" min="0" inputmode="decimal"
      value="${total != null ? total : ''}" placeholder="未设" />㎡
    <span class="cov">已登记 <b>${known}</b>/${f.rooms.length} · ${cov}%</span>`;

  const inp = bar.querySelector('#floorAreaInput');
  inp.onchange = () => {
    setFloorTotal(b, f, inp.value);
    buildRoomPane();
    if (state.selected) showDetail(state.selected);
    buildStats();
  };
  inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
}

function FLOORS_AT(bi, fi){ return BUILDINGS[bi].floors[fi]; }
function markRoomRow(r){
  document.querySelectorAll('#roomList .rm').forEach(el => {
    el.classList.toggle('on',
      +el.dataset.bi === r.bi && +el.dataset.fi === r.fi && +el.dataset.ri === r.ri);
