/* --- 空置房源（当前楼栋全部楼层） --- */
function vacantOf(b){
  const out = { vacant:[], pending:[], borrowed:[] };
  b.floors.forEach(f => f.rooms.forEach(r => {
    if (r.occ !== 'inuse' && out[r.occ]) out[r.occ].push(r);
  }));
  return out;
}
function buildVacantPane(){
  const b = curB();
  const v = vacantOf(b);
  const total = v.vacant.length + v.pending.length + v.borrowed.length;
  const officeAll = b.floors.flatMap(f => f.rooms).filter(r => !NON_OCCUPIABLE[r.cat]).length;
  const rate = officeAll ? (total / officeAll * 100).toFixed(1) : '0.0';
  document.getElementById('vacBadge').textContent = total;
  document.getElementById('vacBadge').style.background = total ? '#2f9e6b' : '#b6c3d2';

  const list = document.getElementById('vacantList');
  if (!total){
    list.innerHTML = `<div class="vempty">${b.name} 暂无空置或待腾退的办公房间</div>`;
    return;
  }

  const html = [];
  html.push(`<div class="rmhead"><b>${b.name}</b> 空置 ${total} 间
    <span class="sp">占办公 ${rate}%</span></div>`);

  ['vacant', 'pending', 'borrowed'].forEach(k => {
    const arr = v[k];
    if (!arr.length) return;
    const o = OCC[k];
    html.push(`<div class="vgh"><i style="background:${o.c}"></i>${o.label}<span>${arr.length}</span></div>`);
    arr.sort((x, y) => x.fi - y.fi || byNo(x, y)).forEach(r => {
      const f = b.floors[r.fi];
      html.push(`<div class="rm" data-bi="${r.bi}" data-fi="${r.fi}" data-ri="${r.ri}">
        <span class="sw" style="background:${o.c}"></span>
        <span class="no">${f.tag}</span>
        <span class="nm">${r.no ? r.no + ' ' : ''}${r.label}${
          (() => {
            const n = (r.notes || '').replace(/\s+/g, '');
            const l = String(r.label).replace(/\s+/g, '');
            if (!n || n === l || n.includes(l) || l.includes(n)) return '';
            return '<em class="sub"> · ' + r.notes + '</em>';
          })()
        }</span>
        <span class="pc">${(r.frac * 100).toFixed(1)}%</span>
      </div>`);
    });
  });
  list.innerHTML = html.join('');

  list.querySelectorAll('.rm').forEach(el => {
    el.onclick = () => {
      const r = FLOORS_AT(+el.dataset.bi, +el.dataset.fi).rooms[+el.dataset.ri];
      if (r) gotoRoom(r);
    };
  });
}

/* --- 维护面板（当前楼栋全部有记录的房间） --- */
function buildMntPane(){
  const b = curB();
  const list = document.getElementById('mntList');
  const buckets = { open: [], doing: [], done: [] };

  b.floors.forEach(f => f.rooms.forEach(r => {
    if (!canMaintain(r)) return;
    const recs = recsOf(r);
    if (!recs.length) return;
    const active = recs.filter(x => x.status !== 'done');
    if (active.some(x => x.status === 'open')) buckets.open.push(r);
    else if (active.length) buckets.doing.push(r);
    else buckets.done.push(r);
  }));

  const total = buckets.open.length + buckets.doing.length + buckets.done.length;
  if (!total){
    list.innerHTML = `<div class="vempty">${b.name} 暂无维护记录<br>
      <span style="font-size:10px">点击任意会议室或办公室，在详情卡里「＋ 报修」</span></div>`;
    return;
  }

  const html = [];
  html.push(`<div class="rmhead"><b>${b.name}</b> ${total} 间有记录
    <span class="sp">已保存至服务器</span>
    <button id="mntExport" title="导出本楼栋维护记录 JSON"
      style="border:1px solid rgba(176,196,222,.8);background:rgba(255,255,255,.9);
             font-family:inherit;font-size:9.5px;color:#5a6c83;border-radius:5px;
             padding:1px 5px;cursor:pointer;margin-left:4px">导出</button></div>`);

  [['open', '待处理'], ['doing', '维修中'], ['done', '已完成']].forEach(([k, label]) => {
    const arr = buckets[k];
    if (!arr.length) return;
    const st = MNT_STATUS[k];
    html.push(`<div class="vgh"><i style="background:${st.c}"></i>${label}<span>${arr.length}</span></div>`);
    arr.sort((x, y) => x.fi - y.fi || byNo(x, y)).forEach(r => {
      const f = b.floors[r.fi];
      const recs = recsOf(r).filter(x => (k === 'done' ? x.status === 'done' : x.status !== 'done'));
      const latest = recs.slice().sort((x, y) => y.createdAt - x.createdAt)[0];
      html.push(`<div class="rm ${k !== 'done' ? 'mnt' : ''}" data-bi="${r.bi}" data-fi="${r.fi}" data-ri="${r.ri}">
        <span class="sw" style="background:${st.c}"></span>
        <span class="no">${f.tag}</span>
        <span class="nm">${r.no ? r.no + ' ' : ''}${r.label}<em class="sub"> · ${latest.type}</em></span>
        <span class="wrench">${recs.length}</span>
      </div>`);
    });
  });

  list.innerHTML = html.join('');
  list.querySelectorAll('.rm').forEach(el => {
    el.onclick = () => {
      const r = FLOORS_AT(+el.dataset.bi, +el.dataset.fi).rooms[+el.dataset.ri];
      if (!r) return;
      gotoRoom(r);
    };
  });

  const exp = list.querySelector('#mntExport');
  if (exp) exp.onclick = e => { e.stopPropagation(); exportMnt(b); };
}

/* 导出当前楼栋的维护记录：台账要能拿出去，不能只留在这台机器上 */
function exportMnt(b){
  const rows = [];
  b.floors.forEach(f => f.rooms.forEach(r => {
    recsOf(r).forEach(rec => {
      rows.push({
        楼栋: b.name, 楼层: f.tag, 房号: r.no || '', 房间: r.label,
        功能: catInfo(r.cat).label, 使用人: r.person || '',
        面积: (() => { const a = areaOf(r); return a ? (a.est ? '≈' : '') + a.v : ''; })(),
        类型: rec.type, 事项: rec.title, 状态: MNT_STATUS[rec.status].label,
        报修人: rec.who || '', 说明: rec.note || '',
        报修时间: new Date(rec.createdAt).toLocaleString('zh-CN'),
        更新时间: new Date(rec.updatedAt).toLocaleString('zh-CN')
      });
    });
  }));
  // 改过资料的房间单独列一段：人员变动靠这个留档
  const edited = [];
  b.floors.forEach(f => f.rooms.forEach(r => {
    if (!hasRoomOvr(r)) return;
    const o = ROOM_OVR[r.uid];
    const chg = (o.history || []).flatMap(h => h.changes.map(c => ({
      时间: new Date(h.at).toLocaleString('zh-CN'),
      修改人: h.by || '',
      字段: FIELD_LABEL[c.field] || c.field,
      原值: c.from, 新值: c.to
    })));
    edited.push({
      楼栋: b.name, 楼层: f.tag, 房号: r.no || '', 房间: r.label,
      功能: catInfo(r.cat).label, 使用人: r.person || '', 部门: r.dept || '',
      备注: r.notes || '',
      面积: (() => { const a = areaOf(r); return a ? (a.est ? '≈' : '') + a.v : ''; })(),
      面积来源: (() => { const a = areaOf(r); return a ? (a.est ? '折算' : '实测/录入') : '未登记'; })(),
      原始房间名: r.orig.label, 原始使用人: r.orig.person || '',
      变更记录: chg
    });
  }));

  const payload = {
    导出时间: new Date().toLocaleString('zh-CN'),
    楼栋: b.name,
    维护记录数: rows.length,
    维护记录: rows,
    资料修改房间数: edited.length,
    资料修改: edited
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `房间台账_${b.name}_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

const detailEl = document.getElementById('detail');
function showDetail(r){
  const b = BUILDINGS[r.bi];
  const f = b.floors[r.fi];
  const cat = catInfo(r.cat);
  const chip = document.getElementById('dChip');
  chip.querySelector('i').style.background = '#' + cat.c.toString(16).padStart(6, '0');
  chip.querySelector('span').textContent = cat.label;
  document.getElementById('dNo').textContent =
    `${b.name} · ${f.tag}${r.no ? ' · 房间 ' + r.no : ''}`;
  const nameEl = document.getElementById('dName');
  nameEl.innerHTML = escHtml(r.label || '未命名')
    + (hasRoomOvr(r) ? '<span class="edited" title="资料已修改">已修改</span>' : '');
  const subs = [];
  if (r.person && r.person !== r.label) subs.push(r.person);
  if (r.notes) subs.push(r.notes);
  if (!subs.length && r.dept && r.dept !== r.label) subs.push(r.dept);
  if (!subs.length && r.label !== cat.label) subs.push(cat.label);
  document.getElementById('dSub').textContent = subs.join(' · ') || f.short;

  const rows = [
    ['所在楼层', /^[一二三四五六七八九十]+层$/.test(f.short) ? `${b.name} ${f.tag}` : `${b.name} ${f.tag}　${f.short}`],
    ['功能类别', cat.label],
    ['所在方位', r.dir]
  ];
  if (r.person && r.person !== r.label) rows.push(['使用人', r.person]);
  if (r.dept && r.dept !== r.label && r.dept !== r.person) rows.push(['部门', r.dept]);
  const ar = areaOf(r);
  rows.push(['面积', ar
    ? fmtArea(ar) + (ar.est ? '<span style="font-weight:400;color:#9aabbd;font-size:10px">（折算）</span>' : '')
    : '<span style="color:#a9b6c5;font-weight:400">未登记</span>']);
  if (r.notes) rows.push(['备注', r.notes]);
  if (roomUpdatedAt(r)) rows.push(['资料更新', fmtDate(roomUpdatedAt(r))]);
  document.getElementById('dList').innerHTML = rows
    .map(([a, c]) => `<div><dt>${a}</dt><dd>${c}</dd></div>`).join('');

  const pct = r.frac * 100;
  document.getElementById('dFrac').textContent = pct.toFixed(1) + '%';
  document.getElementById('dBar').style.width = Math.min(100, pct * 2.6) + '%';

  const rest = r.lines.filter(x => x !== r.no);
  const flat = rest.join('').replace(/\s+/g, '');
  const cmp = (r.label + (r.person || '') + (r.notes || '')).replace(/\s+/g, '');
  document.getElementById('dRaw').textContent = flat && flat !== cmp ? '原图标注：' + rest.join(' ／ ') : '';
  renderMntBlock(r);
  renderHistory(r);
  renderEditForm(r);
  document.getElementById('dEdit').classList.toggle('on', editingRoom === r);
  detailEl.classList.add('show');
}

/* ---------- 详情卡：资料编辑 ---------- */
let editingRoom = null;

function fmtDate(ts){
  const d = new Date(ts);
  const p2 = n => String(n).padStart(2, '0');
  return `${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

function renderEditForm(r){
  const form = document.getElementById('dEditForm');
  if (!form) return;
  const isOpen = editingRoom === r;
  form.classList.toggle('on', isOpen);
  if (!isOpen){ form.innerHTML = ''; return; }

  const catOpts = Object.keys(CAT)
    .filter(k => CAT[k] && CAT[k].label)
    .map(k => `<option value="${k}"${r.cat === k ? ' selected' : ''}>${catInfo(k).label}</option>`)
    .join('');

  const curArea = areaOf(r);
  const estHint = curArea && curArea.est
    ? `留空则按本层合计折算 ≈${curArea.v}㎡`
    : '如：22';
  form.innerHTML = `
    <div class="fl">房间名</div>
    <input id="efLabel" value="${escAttr(r.label)}" placeholder="如：会议室 / 经营一部" />
    <div class="fl">使用人（人员变动改这里）</div>
    <input id="efPerson" value="${escAttr(r.person)}" placeholder="留空表示无人使用" />
    <div class="fl">部门</div>
    <input id="efDept" value="${escAttr(r.dept)}" placeholder="如：经营一部" />
    <div class="fl">功能类别</div>
    <select id="efCat">${catOpts}</select>
    <div class="fl">面积（㎡）</div>
    <input id="efArea" type="number" step="0.1" min="0" inputmode="decimal"
      value="${r.area != null ? r.area : ''}"
      placeholder="${estHint}" />
    <div class="fl">备注</div>
    <textarea id="efNotes" placeholder="如：借用 / 待退房 / 22㎡">${escHtml(r.notes)}</textarea>
    <div class="fl">本次修改人（写入变更记录）</div>
    <input id="efBy" value="${escAttr(lastEditor)}" placeholder="可选" />
    <div class="hintline">原始值为「${escHtml(r.orig.label)}${r.orig.person ? ' · ' + escHtml(r.orig.person) : ''}」。改动会记入变更历史，可随时恢复原值。</div>
    <div class="acts">
      ${hasRoomOvr(r) ? '<button type="button" class="rst" id="efRestore">恢复原值</button>' : ''}
      <button type="button" class="no" id="efCancel">取消</button>
      <button type="button" class="ok" id="efSave">保存</button>
    </div>`;

  form.querySelector('#efSave').onclick = () => {
    const patch = {
      label: form.querySelector('#efLabel').value,
      person: form.querySelector('#efPerson').value,
      dept: form.querySelector('#efDept').value,
      notes: form.querySelector('#efNotes').value,
      cat: form.querySelector('#efCat').value,
      area: form.querySelector('#efArea').value
    };
    const by = form.querySelector('#efBy').value.trim();
    if (by) lastEditor = by;
    // 房间名不能清空，否则列表和搜索都会失去抓手
    if (!patch.label.trim()) patch.label = r.label;
    patch.label = patch.label.trim();
    patch.person = patch.person.trim();
    patch.dept = patch.dept.trim();
    patch.notes = patch.notes.trim();

    const rec = saveRoomInfo(r, patch, by || lastEditor);
    editingRoom = null;
    afterRoomEdit(r, !!rec);
  };
  form.querySelector('#efCancel').onclick = () => {
    editingRoom = null;
    renderEditForm(r);
  };
  const rst = form.querySelector('#efRestore');
  if (rst) rst.onclick = () => {
    restoreRoomInfo(r);
    editingRoom = null;
    afterRoomEdit(r, true);
  };
}

function escHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
const escAttr = escHtml;

let lastEditor = '';
try { lastEditor = localStorage.getItem('hq3d.editor') || ''; } catch (e) {}

/* 资料改完后，所有依赖房间字段的地方都要重刷 */
function afterRoomEdit(r, changed){
  if (changed){
    try { localStorage.setItem('hq3d.editor', lastEditor); } catch (e) {}
  }
  // 3D 标签、颜色（类别可能改了）、维护斜纹、列表、统计、搜索索引
  buildLabels();
  syncMntVisual();
  buildRoomPane();
  if (curPane === 'vacant') buildVacantPane();
  else if (curPane === 'mnt') buildMntPane();
  buildStats();
  updateVacBadge();
  updateMntBadge();
  buildFloorList();
  syncList();
  // 类别变了要重上色
  r.mesh.material.color.copy(new THREE.Color(catInfo(r.cat).c));
  r.mesh.userData.baseColor = r.mesh.material.color.clone();
  showDetail(r);
}

function renderHistory(r){
  const el = document.getElementById('dHist');
  if (!el) return;
  const hist = roomHistory(r).slice().reverse();
  if (!hist.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="histbox"><div class="h">变更历史</div>${
    hist.slice(0, 6).map(h => {
      const unit = f => (f === 'area' ? ' ㎡' : '');
      const parts = h.changes.map(c =>
        `${FIELD_LABEL[c.field] || c.field}：${c.from ? `<s>${escHtml(c.from)}${unit(c.field)}</s> ` : ''}<b>${escHtml(c.to) || '（空）'}${c.to ? unit(c.field) : ''}</b>`
      ).join('；');
      return `<div class="histrow"><span class="t">${fmtDate(h.at)}</span>
        <span class="c">${parts}${h.by ? '　— ' + escHtml(h.by) : ''}</span></div>`;
    }).join('')
  }</div>`;
}

/* ---------- 详情卡里的维护区块 ---------- */
function renderMntBlock(r){
  const el = document.getElementById('dMnt');
  if (!el) return;
  if (!canMaintain(r)){
    el.innerHTML = `<div class="mnthead"><span class="t">维护</span>
      <span class="mntpill none"><i></i>不适用</span></div>
      <div class="meta" style="font-size:10.5px;color:#8798ac;line-height:1.6">
        仅会议室与办公室参与维护管理，楼梯、电梯、卫生间等按物业统一流程处理。</div>`;
    return;
  }

  const st = mntState(r);
  const recs = recsOf(r).slice().sort((a, c) => {
    const oa = MNT_STATUS[a.status].order, oc = MNT_STATUS[c.status].order;
    return oa !== oc ? oa - oc : c.createdAt - a.createdAt;
  });
  const activeN = recs.filter(x => x.status !== 'done').length;

  const statusPill = st === 'none'
    ? `<span class="mntpill none"><i></i>正常</span>`
    : `<span class="mntpill ${st}"><i style="background:${MNT_STATUS[st].c}"></i>${MNT_STATUS[st].label}</span>`;

  const list = recs.length ? recs.map(rec => {
    const s2 = MNT_STATUS[rec.status];
    const ops = [];
    if (rec.status === 'open') ops.push(`<button data-act="doing" data-id="${rec.id}">开始维修</button>`);
    if (rec.status === 'doing') ops.push(`<button data-act="done" data-id="${rec.id}">标记完成</button>`);
    if (rec.status === 'done') ops.push(`<button data-act="reopen" data-id="${rec.id}">重新打开</button>`);
    ops.push(`<button class="del" data-act="del" data-id="${rec.id}">删除</button>`);
    return `<div class="mrec">
      <div class="top">
        <span class="ty">${rec.type}</span>
        <span class="ti">${rec.title}</span>
        <span class="mntpill ${rec.status}" style="padding:1px 6px;font-size:9px">
          <i style="background:${s2.c}"></i>${s2.label}</span>
      </div>
      <div class="meta">${fmtDate(rec.createdAt)}${rec.who ? ' · ' + rec.who : ''}${
        rec.status === 'done' && rec.updatedAt !== rec.createdAt ? ' · 完成于 ' + fmtDate(rec.updatedAt) : ''}</div>
      ${rec.note ? `<div class="note">${rec.note}</div>` : ''}
      <div class="ops">${ops.join('')}</div>
    </div>`;
  }).join('') : `<div style="font-size:10.5px;color:#8798ac;padding:2px 0 4px">暂无维护记录</div>`;

  el.innerHTML = `
    <div class="mnthead">
      <span class="t">维护</span>
      ${statusPill}
      ${activeN > 1 ? `<span style="font-size:10px;color:#b8432c">${activeN} 条进行中</span>` : ''}
      <button class="add" id="mntAdd">＋ 报修</button>
    </div>
    <form class="mform" id="mntForm" autocomplete="off">
      <div class="row">
        <select id="mfType">${MNT_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
        <input id="mfWho" placeholder="报修人（可选）" style="max-width:120px" />
      </div>
      <input id="mfTitle" placeholder="问题标题，如：空调不制冷" />
      <textarea id="mfNote" placeholder="补充说明（可选）"></textarea>
      <div class="acts">
        <button type="button" class="no" id="mfCancel">取消</button>
        <button type="submit" class="ok">提交报修</button>
      </div>
    </form>
    <div id="mntRecs">${list}</div>`;

  // 交互
  const form = el.querySelector('#mntForm');
  el.querySelector('#mntAdd').onclick = () => {
    form.classList.add('on');
    el.querySelector('#mfTitle').focus();
  };
  el.querySelector('#mfCancel').onclick = () => form.classList.remove('on');
  form.onsubmit = e => {
    e.preventDefault();
    const title = el.querySelector('#mfTitle').value.trim();
    const type = el.querySelector('#mfType').value;
    addRecord(r, {
      type,
      title: title || type + '报修',
      note: el.querySelector('#mfNote').value.trim(),
      who: el.querySelector('#mfWho').value.trim()
    });
    form.classList.remove('on');
    form.reset();
    afterMntChange(r, true);
  };
  el.querySelectorAll('.ops button').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id, act = b.dataset.act;
      if (act === 'del') deleteRecord(r, id);
      else if (act === 'reopen') setRecordStatus(r, id, 'open');
      else setRecordStatus(r, id, act);
      afterMntChange(r, false);
    };
  });
}

/* 维护数据变动后的统一刷新 */
function afterMntChange(r, focusForm){
  syncMntVisual();
  renderMntBlock(r);
  buildRoomPane();
  if (curPane === 'mnt') buildMntPane();
  else refreshPane();
  updateMntBadge();
  buildStats();
  if (focusForm) renderMntBlock(r);
}

function clearSelection(silent){
  if (state.selected){
    state.selected.mesh.material.emissiveIntensity = 0;
    tintRoom(state.selected, 1);
    state.liftT = 0;
    state.selected.mesh.position.y = state.selected.mesh.userData.baseY;
  }
  state.liftT = 0;
  state.selected = null;
  editingRoom = null;
  selLines.clear();
  detailEl.classList.remove('show');
  if (!silent) frame();
}
function selectRoom(r, fly){
  if (!r) return;
  if (state.selected && state.selected !== r){
    state.selected.mesh.material.emissiveIntensity = 0;
    tintRoom(state.selected, 1);
  }
  state.selected = r;
  r.mesh.material.emissive = new THREE.Color(catInfo(r.cat).c);
  r.mesh.material.emissiveIntensity = 0.5;
  state.liftT = 1;                       // 触发抬升

  selLines.clear();
  // 贴在房间板顶面：抬升时会跟着一起升，不会被板体埋掉
  selLines.position.set(0, r.mesh.position.y + TILE_H / 2 + 0.012
    + (state.mode === 'all' ? floorY(r.fi, state.spread) : 0), 0);
  const pad = 0.3;
  selLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(r.x + pad, 0, r.z + pad),
    new THREE.Vector3(r.x + r.w - pad, 0, r.z + pad),
    new THREE.Vector3(r.x + r.w - pad, 0, r.z + r.d - pad),
    new THREE.Vector3(r.x + pad, 0, r.z + r.d - pad),
    new THREE.Vector3(r.x + pad, 0, r.z + pad)
  ]), selMat));

  if (r.fi !== state.fi){
    state.fi = r.fi;
    syncList();
    applyVisibility();
  }
  showDetail(r);
  buildLabels();
  markRoomRow(r);
  if (fly) frame();
}
document.getElementById('detailClose').onclick = () => clearSelection();
document.getElementById('dEdit').onclick = () => {
  const r = state.selected;
  if (!r) return;
  editingRoom = (editingRoom === r) ? null : r;
  renderEditForm(r);
  const form = document.getElementById('dEditForm');
  if (editingRoom && form) form.scrollIntoView({ block: 'nearest' });
};

/* =========================================================
   导航
   ========================================================= */
function gotoFloor(i, keepSel, stayInTower){
  const b = curB();
  if (i < 0 || i >= b.floors.length) return;
  if (i !== state.fi) b.floors[i].group.userData.rise = 0;   // 触发升起
  state.fi = i;
  // 整栋模式下点楼板/楼层列表 = 「进入」这一层；点右侧刻度 = 只切换高亮，留在整栋
  if (!stayInTower && state.mode === 'all'){
    state.mode = 'one';
    state.target = 0;
    syncMode();
    b.floors.forEach(f => { f.group.position.y = 0; f.group.userData.lift = 0; });
  }
  if (!keepSel) clearSelection(true);
  const hasCat = curF().rooms.some(r => r.cat === state.dimCat);
  if (state.dimCat && !hasCat){
    state.dimCat = null;
    curB().floors.forEach(f => f.rooms.forEach(r => {
      tintRoom(r, 1);
      r.mesh.userData.pickable = true;
    }));
    buildLegend();
  }
  syncList();
  applyVisibility();
  buildLabels();
  refreshPane();
  frame();
}
function gotoBuilding(bi){
  if (bi === state.bi){ return; }
  state.bi = bi;
  state.fi = 0;
  state.mode = 'one';
  state.spread = 0;
  state.target = 0;
  state.dimCat = null;
  clearSelection(true);
  curB().floors.forEach(f => { f.group.position.y = 0; });
  syncMode();
  buildFloorList();
  buildFloorTicks();
  buildLegend();
  buildStats();
  syncList();
  applyVisibility();
  buildLabels();
  refreshPane();
  frame();
}
function gotoRoom(r){
  if (r.bi !== state.bi) gotoBuilding(r.bi);
  state.fi = r.fi;
  if (state.mode === 'all'){ state.mode = 'one'; state.target = 0; syncMode(); }
  syncList();
  applyVisibility();
  buildLabels();
  refreshPane();
  selectRoom(r, true);
}

function syncMode(){
  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
  // 外观/剖切只对整栋有意义
  document.getElementById('segFacade').classList.toggle('on', state.mode === 'all');
  document.querySelectorAll('#segFacade button').forEach(b =>
    b.classList.toggle('on', b.dataset.facade === state.facade));
}
document.getElementById('segMode').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  state.target = state.mode === 'all' ? 1 : 0;
  if (state.mode !== 'all') curB().floors.forEach(f => { f.group.position.y = 0; });
  syncMode();
  applyVisibility();
  buildLabels();
  frame();
});

document.getElementById('segFacade').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.facade = btn.dataset.facade;
  syncMode();
  applyVisibility();
  frame();
});

/* =========================================================
   搜索（跨楼栋）
   ========================================================= */
const qEl = document.getElementById('q');
const resEl = document.getElementById('results');
const qClr = document.getElementById('qClr');
let hits = [], hitIdx = -1;

function allRooms(){
  const out = [];
  BUILDINGS.forEach(b => b.floors.forEach(f => f.rooms.forEach(r => out.push(r))));
  return out;
}
function doSearch(){
  const q = qEl.value.trim().toLowerCase();
  qClr.style.display = q ? 'block' : 'none';
  if (!q){ resEl.classList.remove('show'); hits = []; return; }
  hits = allRooms().filter(r => {
    const b = BUILDINGS[r.bi], f = b.floors[r.fi];
    const ar0 = areaOf(r);
    const hay = [r.no, r.label, r.person, r.dept, r.notes, f.tag, f.short, b.name,
                 ar0 ? ar0.v : ''].join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(0, 60);
  hitIdx = hits.length ? 0 : -1;
  if (!hits.length){
    resEl.innerHTML = '<div class="empty">没有匹配的房号 / 部门 / 人员</div>';
    resEl.classList.add('show');
    return;
  }
  resEl.innerHTML = hits.map((r, i) => {
    const b = BUILDINGS[r.bi], f = b.floors[r.fi];
    return `<div class="r${i === 0 ? ' hl' : ''}" data-i="${i}">
      <i class="${r.bi ? 'b2' : ''}">${f.tag}</i>
      <b>${r.no ? r.no + ' ' : ''}${r.label || '—'}</b>
      <em>${(() => {
        const a = areaOf(r);
        if (a) return fmtArea(a);
        return (b.id === 'annex' ? '南配楼 ' : '') +
          (r.person && r.person !== r.label ? r.person : catInfo(r.cat).label);
      })()}</em></div>`;
  }).join('');
  resEl.classList.add('show');
  resEl.querySelectorAll('.r').forEach(el => {
    el.onclick = () => { gotoRoom(hits[Number(el.dataset.i)]); resEl.classList.remove('show'); };
  });
}
qEl.addEventListener('input', doSearch);
qEl.addEventListener('focus', () => { if (qEl.value.trim()) doSearch(); });
qClr.onclick = () => { qEl.value = ''; doSearch(); qEl.focus(); };
qEl.addEventListener('keydown', e => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    hitIdx = (hitIdx + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    resEl.querySelectorAll('.r').forEach((el, i) => el.classList.toggle('hl', i === hitIdx));
    const cur = resEl.querySelectorAll('.r')[hitIdx];
    if (cur) cur.scrollIntoView({ block:'nearest' });
  } else if (e.key === 'Enter'){
    e.preventDefault();
    gotoRoom(hits[hitIdx]);
    resEl.classList.remove('show');
  } else if (e.key === 'Escape'){
    resEl.classList.remove('show');
    qEl.blur();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search')) resEl.classList.remove('show');
});

/* =========================================================
   拾取
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null, needPick = false, downPos = null;
const tip = document.getElementById('tip');

function pickTargets(){
  const arr = [];
  const b = curB();
  if (state.mode === 'all'){
    // 整栋模式：只拾取楼板 —— 点哪层就切到哪层，行为可预期，
    // 也避免 300+ 房间同时参与射线检测带来的开销
    b.floors.forEach(f => {
      if (f.group.visible) f.group.children.forEach(o => {
        if (o.userData.slabFi !== undefined) arr.push(o);
      });
    });
  } else {
    curF().rooms.forEach(r => {
      if (r.mesh.visible && r.mesh.userData.pickable !== false) arr.push(r.mesh);
    });
  }
  return arr;
}
function pick(){
  raycaster.setFromCamera(pointer, camera);
  const hs = raycaster.intersectObjects(pickTargets(), false);
  return hs.length ? hs[0].object : null;
}
function updateHover(){
  if (!needPick) return;
  needPick = false;
  const obj = pick();
  if (hovered && hovered !== obj && (!state.selected || hovered !== state.selected.mesh) && hovered.material){
    hovered.material.emissiveIntensity = 0;

  }
  if (obj && obj.userData.slabFi !== undefined && state.mode === 'all'){
    const fi = obj.userData.slabFi;
    state.hoverFi = fi;
    const fl = curB().floors[fi];
    const n = fl.rooms.length;
    const vacN = fl.rooms.filter(r => r.occ !== 'inuse').length;
    tip.textContent = `${fl.tag} · ${n} 间${vacN ? ` · ${vacN} 处空置` : ''}　点击进入`;
    tip.classList.add('show');
    canvas.style.cursor = 'pointer';
    hovered = obj;
    return;
  }
  if (obj && obj.userData.room && (!state.selected || obj !== state.selected.mesh)){
    obj.material.emissive = new THREE.Color(catInfo(obj.userData.room.cat).c);
    obj.material.emissiveIntensity = 0.26;
    const r = obj.userData.room;
    tip.textContent = `${r.no ? r.no + ' · ' : ''}${r.label}${r.person && r.person !== r.label ? ' · ' + r.person : ''}`;
    tip.classList.add('show');
    canvas.style.cursor = 'pointer';
  } else {
    tip.classList.remove('show');
    canvas.style.cursor = obj ? 'pointer' : 'default';
    if (state.mode === 'all') state.hoverFi = -1;
  }
  hovered = obj;
}

canvas.addEventListener('pointermove', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  tip.style.left = e.clientX + 'px';
  tip.style.top = e.clientY + 'px';
  needPick = true;
});
canvas.addEventListener('pointerleave', () => {
  pointer.set(-10, -10);
  needPick = true;
  state.hoverFi = -1;
  tip.classList.remove('show');
});
canvas.addEventListener('pointerdown', e => { downPos = { x:e.clientX, y:e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 5) return;
  const obj = pick();
  if (!obj){ clearSelection(); return; }
  if (obj.userData.room){ selectRoom(obj.userData.room); return; }
  if (obj.userData.slabFi !== undefined && state.mode === 'all'){ gotoFloor(obj.userData.slabFi); }
});
window.addEventListener('keydown', e => {
  if (document.activeElement === qEl) return;
  const b = curB();
  if (e.key === 'Escape') clearSelection();
  if (e.key === 'ArrowUp') gotoFloor(Math.min(b.floors.length - 1, state.fi + 1));
  if (e.key === 'ArrowDown') gotoFloor(Math.max(0, state.fi - 1));
  if (e.key === '1') gotoBuilding(0);
  if (e.key === '2' && BUILDINGS[1]) gotoBuilding(1);
});

/* =========================================================
   整栋模式的楼层刻度（右侧竖列，点击切层）
   ========================================================= */
const ticksEl = document.getElementById('floorTicks');
function buildFloorTicks(){
  ticksEl.innerHTML = '';
  const b = curB();
  b.floors.slice().reverse().forEach((f, k) => {
    const i = b.floors.length - 1 - k;
    const btn = document.createElement('button');
    btn.dataset.fi = i;
    const vac = f.rooms.some(r => r.occ !== 'inuse');
    btn.className = vac ? 'vacant-dot' : '';
    btn.innerHTML = `<span>${f.tag}</span><i></i>`;
    btn.onclick = () => gotoFloor(i, false, true);   // 留在整栋，只换高亮
    ticksEl.appendChild(btn);
  });
}
const tv = new THREE.Vector3();
function updateFloorTicks(){
  const on = state.mode === 'all';
  ticksEl.classList.toggle('on', on);
  if (!on) return;
  const b = curB();
  const W = window.innerWidth, H = window.innerHeight;
  ticksEl.querySelectorAll('button').forEach(btn => {
    const i = +btn.dataset.fi;
    const y = floorY(i, state.spread) + (b.floors[i] ? b.floors[i].h : FH) * 0.5;
    // 刻度贴着「这一层」的体量放：5 层以上收进后仍按裙楼宽度放会飘在楼外
    const fw = b.floors[i] ? b.floors[i].FW : b.FW;
    tv.set(fw / 2 + fw * 0.06, y, 0).project(camera);
    const py = (-tv.y * 0.5 + 0.5) * H;
    btn.style.top = Math.max(4, Math.min(H - 18, py - 6)) + 'px';
    btn.classList.toggle('on', i === state.fi);
  });
}

/* =========================================================
   指北针 & 主循环
   ========================================================= */
const needleEl = document.getElementById('needle');
const invQ = new THREE.Quaternion();
const northV = new THREE.Vector3();
function updateCompass(){
  invQ.copy(camera.quaternion).invert();
  northV.set(0, 0, -1).applyQuaternion(invQ);
  needleEl.style.transform = `rotate(${Math.atan2(northV.x, northV.y)}rad)`;
}

function animate(){
  requestAnimationFrame(animate);

  if (Math.abs(state.spread - state.target) > 0.001){
    state.spread += (state.target - state.spread) * 0.12;
    curB().floors.forEach((f, i) => { f.group.position.y = floorY(i, state.spread); });
  }

  /* 层间空隙：外观模式贴合成实心体量，剖切模式拉开看清楼层 */
  const gapWant = state.mode === 'all'
    ? (state.facade === 'solid' ? GAP_SOLID : GAP)
    : state.gap;
  if (Math.abs(state.gap - gapWant) > 0.002){
    state.gap += (gapWant - state.gap) * 0.13;
    const bb = curB();
    bb.floors.forEach((f, i) => { f.group.position.y = floorY(i, state.spread); });
    refreshBuildingShell(bb);
    if (desired.on) frame();        // 体量变了，取景要跟着重算
  }

  /* 整栋模式：鼠标悬停的楼层向上浮起，当前层也抬高一点 —— 楼层像抽屉一样被抽出 */
  if (state.mode === 'all'){
    const sp = state.spread;
    curB().floors.forEach((f, i) => {
      const u = f.group.userData;
      const want = (i === state.hoverFi) ? 1.5 : (i === state.fi ? 0.55 : 0);
      u.lift = (u.lift || 0) + (want - (u.lift || 0)) * 0.16;
      f.group.position.y = floorY(i, sp) + u.lift;
      // 悬停层的幕墙框更亮，其余保持低调
      if (u.eaveMat){
        const hot = i === state.hoverFi ? 1 : (i === state.fi ? 0.85 : 0.5);
        u.eaveMat.color.setHex(0xdceaf8).lerp(new THREE.Color(0x8fc4f5), 1 - hot);
        u.eaveMat.emissiveIntensity = 0;
      }
      if (u.tag){
        const hot = (i === state.hoverFi || i === state.fi);
        u.tag.visible = hot;
        if (hot){
          const k = i === state.hoverFi ? 1.3 : 1.1;
          const bs = u.tag.userData.baseScale || 3.4;
          u.tag.scale.set(bs * k, bs * k * 0.5, 1);
        }
      }
    });
  } else {
    // 退出整栋时把浮起归零，避免切回单层时楼层错位
    curB().floors.forEach(f => { f.group.userData.lift = 0; });
  }

  if (desired.on){
    // 必须与 solveView / frame() 用同一个方向。少写一个分支（如 roof），
    // 相机会沿别的方向落位，取景完全失效 —— 这个坑已经踩了两次
    const dir = state.mode === 'plan' ? DIR_PLAN
              : state.mode === 'all'
                ? (state.facade === 'solid' ? DIR_REAL : DIR_TOWER)
                : DIR_3D;
    const goal = desired.target.clone().addScaledVector(dir, desired.dist);
    camera.position.lerp(goal, 0.1);
    controls.target.lerp(desired.target, 0.1);
    if (camera.position.distanceTo(goal) < 0.25){
      camera.position.copy(goal);
      controls.target.copy(desired.target);
      desired.on = false;
    }
  }

  // 切层升起动画（仅单层/平面模式；整栋模式位置由 spread 控制）
  if (state.mode !== 'all'){
    const fg = curB().floors[state.fi].group;
    const ua = fg.userData;
    if (ua.rise === undefined) ua.rise = 1;
    if (ua.rise < 1){
      ua.rise = Math.min(1, ua.rise + 0.11);
      const e = 1 - Math.pow(1 - ua.rise, 3);
      fg.position.y = -(1 - e) * 1.8;
    } else if (fg.position.y !== 0){
      fg.position.y = 0;
    }
  }

  // 选中房间抬升：立体感最强的单一手段
  if (state.selected){
    const u = state.selected.mesh.userData;
    const lift = 0.34;
    const cur = state.selected.mesh.position.y - u.baseY;
    const want = state.liftT ? lift : 0;
    const next = cur + (want - cur) * 0.18;
    state.selected.mesh.position.y = u.baseY + next;
    selLines.position.y = state.selected.mesh.position.y + TILE_H / 2 + 0.012;
  }

  /* 维护中的房间：暖光呼吸 + 斜纹层跟随楼层抬升 */
  if (mntPulse.length){
    const ph = 0.5 + 0.5 * Math.sin(performance.now() * 0.0028);
    const k = 0.20 + 0.18 * ph;
    for (const r of mntPulse){
      if (r !== state.selected){
        r.mesh.material.emissive.setHex(0xd65440);
        r.mesh.material.emissiveIntensity = k;
      }
      if (r.hatch && r.hatch.visible){
        r.hatch.position.y = r.mesh.position.y + TILE_H / 2 + 0.03;
      }
    }
  }

  updateHover();
  controls.update();
  updateLabels();
  updateFloorTicks();
  updateCompass();
  renderer.render(scene, camera);
}

/* ---------- 面板宽度与托盘：浏览体验的两个开关 ----------
   宽度：拖右缘调整，双击复位；托盘：图例与统计默认收起。
   两者都存 localStorage —— 这是纯界面偏好，不属于业务数据。 */
const SIDE_W_KEY = 'hq3d.sideWidth';
const TRAY_KEY = 'hq3d.trayOpen';

function applySideWidth(px){
  const w = Math.max(300, Math.min(560, Math.round(px)));
  document.documentElement.style.setProperty('--side-w', w + 'px');
  return w;
}
(function restoreSideWidth(){
  let w = 0;
  try { w = Number(localStorage.getItem(SIDE_W_KEY)) || 0; } catch (e) {}
  // 小屏不套用记忆宽度，否则会把画布挤没
  if (w && window.innerWidth > 1100) applySideWidth(w);
})();

(function initSideGrip(){
  const grip = document.getElementById('sideGrip');
  const side = document.getElementById('side');
  if (!grip || !side) return;
  let dragging = false, startX = 0, startW = 0, moved = false;
  const onMove = (e) => {
    if (!dragging) return;
    const dx = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    if (Math.abs(dx) > 2) moved = true;
    applySideWidth(startW + dx);
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove('drag');
    document.body.classList.remove('side-dragging');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
    if (moved){
      const w = Math.round(side.getBoundingClientRect().width);
      try { localStorage.setItem(SIDE_W_KEY, String(w)); } catch (e) {}
      frame();            // 可见区变了，重新取景，避免模型被加宽的面板压住
    }
  };
  grip.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX; startW = side.getBoundingClientRect().width;
    grip.classList.add('drag');
    document.body.classList.add('side-dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    e.preventDefault();
  });
  // 触摸：pointer 事件在某些浏览器被 canvas 抢走，补一套 touch
  grip.addEventListener('touchstart', (e) => {
    dragging = true; moved = false;
    startX = e.touches[0].clientX; startW = side.getBoundingClientRect().width;
    grip.classList.add('drag');
    document.body.classList.add('side-dragging');
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    e.preventDefault();
  }, { passive: false });
  grip.addEventListener('dblclick', () => {
    applySideWidth(358);
    try { localStorage.removeItem(SIDE_W_KEY); } catch (e) {}
    frame();
  });
})();

(function initTray(){
  const tray = document.getElementById('tray');
  const btn = document.getElementById('trayToggle');
  if (!tray || !btn) return;
  let open = false;
  try { open = localStorage.getItem(TRAY_KEY) === '1'; } catch (e) {}
  const setState = (v) => {
    tray.classList.toggle('open', v);
    btn.setAttribute('aria-expanded', v ? 'true' : 'false');
  };
  setState(open);
  btn.addEventListener('click', () => {
    const next = !tray.classList.contains('open');
    setState(next);
    try { localStorage.setItem(TRAY_KEY, next ? '1' : '0'); } catch (e) {}
  });
})();

/* ---------- 启动 ---------- */
state.spread = 0;
state.target = 0;
buildFloorList();
buildLegend();
buildStats();
syncList();
applyVisibility();
buildLabels();
gotoFloor(0);
buildFloorTicks();
setPane('floors');
syncMntVisual();
buildStats();
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  frame();
});
</script>
